name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    name: サーバー無しで動くか
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx playwright install --with-deps chromium

      # index.html は一枚で完結しているので、まず構文が通ることを確かめる。
      # ブラウザだと壊れた JS が静かに落ちるだけで、テストは「要素が無い」と
      # しか言わない。
      - name: JS の構文
        run: |
          node -e "
            const fs = require('fs');
            const js = fs.readFileSync('index.html','utf8').match(/<script>([\s\S]*)<\/script>/)[1];
            new Function(js);
            console.log('ok');
          "

      - name: オフラインの通しテスト
        run: npm test
