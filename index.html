<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>他力本願カレンダー</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Old+Mincho:wght@600&display=swap');

:root{
  --paper:      #F2F4EC;
  --paper-2:    #E8ECDF;
  --ink:        #232A25;
  --ink-soft:   #5B6459;
  --line:       #C7CDB8;
  --hanko:      #AE3A2E;
  --hanko-soft: #AE3A2E22;
  --highlight:  #F4CC3B;
  --pen-blue:   #35538F;
  --sage:       #75886A;
  --white:      #FDFCF7;
  --danger:     #B4402A;
  --radius:     3px;
  --shadow: 0 1px 0 var(--line);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background: repeating-linear-gradient(#E4E9D8, #E4E9D8 40px, #DEE4CE 41px);
  min-height:100vh;
  font-family:'Zen Kaku Gothic New', sans-serif;
  color:var(--ink);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:24px 12px;
}

/* ---------- phone frame ---------- */
.frame{
  width:100%;
  max-width:430px;
  background:var(--paper);
  min-height:844px;
  position:relative;
  border:1px solid var(--line);
  box-shadow: 0 18px 40px -20px rgba(30,35,25,0.35);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.frame::before{ /* staple marks top */
  content:"";
  position:absolute;
  top:14px; left:22px; width:16px; height:16px;
  background: radial-gradient(circle at 35% 35%, #9aa38c, #6d7562 60%);
  border-radius:50%;
  box-shadow: 0 0 0 3px var(--paper), 380px 0 0 0 #9aa38c33, 383px 0 0 3px var(--paper);
  opacity:.55;
  z-index:5;
}

/* ---------- header ---------- */
.topbar{
  padding:22px 20px 14px;
  border-bottom:1.5px dashed var(--line);
  background:var(--paper);
  position:relative;
  z-index:2;
}
.brand{
  font-family:'Shippori Mincho', serif;
  font-weight:800;
  font-size:20px;
  letter-spacing:.02em;
  display:flex;
  align-items:baseline;
  gap:8px;
}
.brand small{
  font-family:'Zen Kaku Gothic New',sans-serif;
  font-weight:500;
  font-size:11px;
  color:var(--ink-soft);
  letter-spacing:.08em;
}
.screen-title{
  margin-top:10px;
  font-family:'Shippori Mincho', serif;
  font-size:15px;
  font-weight:700;
  color:var(--ink-soft);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.screen-title .idx{
  font-family:'Zen Old Mincho', serif;
  font-size:11px;
  color:var(--hanko);
  border:1px solid var(--hanko);
  border-radius:50%;
  width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;
  transform:rotate(-8deg);
}

/* ---------- main scroll area ---------- */
.main{
  flex:1;
  overflow-y:auto;
  padding:16px 16px 24px;
  position:relative;
}
.main::-webkit-scrollbar{width:0;}

/* ---------- bottom tabs ---------- */
.tabbar{
  display:flex;
  border-top:1.5px dashed var(--line);
  background:var(--paper);
  position:relative;
  z-index:3;
}
.tab{
  flex:1;
  padding:10px 2px 12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  cursor:pointer;
  color:var(--ink-soft);
  font-size:10px;
  font-weight:500;
  border:none;
  background:none;
  font-family:'Zen Kaku Gothic New',sans-serif;
  position:relative;
}
.tab svg{width:20px;height:20px;stroke:var(--ink-soft);transition:stroke .15s;}
.tab.active{color:var(--ink);}
.tab.active svg{stroke:var(--hanko);}
.tab.active::before{
  content:"";
  position:absolute; top:2px; left:50%; transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--hanko);
}

/* ---------- generic elements ---------- */
.card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px;
  margin-bottom:10px;
  position:relative;
}
.card::after{
  content:"";
  position:absolute; left:0; top:0; bottom:0; width:3px;
  background:var(--pen-blue);
  opacity:.55;
}
.card.done::after{background:var(--sage);}
.card.ai::after{background:var(--highlight);}

.label-row{display:flex; align-items:center; gap:6px; margin-bottom:4px; flex-wrap:wrap;}
.chip{
  font-size:10px; font-weight:700; padding:2px 6px; border-radius:2px;
  border:1px solid currentColor;
}
.chip.ai{color:#8a6d0f; border-color:#c7a728; background:#FBF0C7;}
.chip.blue{color:var(--pen-blue); border-color:var(--pen-blue);}
.chip.proj{color:var(--sage); border-color:var(--sage);}

.title-row{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.item-title{font-weight:700; font-size:15px; line-height:1.4;}
.item-title.strike{text-decoration:line-through; color:var(--ink-soft);}
.item-sub{font-size:12px; color:var(--ink-soft); margin-top:3px;}

.section-label{
  font-family:'Shippori Mincho',serif;
  font-size:12px; color:var(--ink-soft); margin:18px 0 8px; letter-spacing:.06em;
  display:flex; align-items:center; gap:8px;
}
.section-label::after{content:""; flex:1; border-bottom:1px dashed var(--line);}

.fab{
  position:absolute; right:18px; bottom:18px;
  width:52px; height:52px; border-radius:50%;
  background:var(--hanko); color:var(--white);
  display:flex; align-items:center; justify-content:center;
  border:none; box-shadow:0 6px 14px -4px rgba(174,58,46,.55);
  font-size:26px; cursor:pointer; z-index:4;
}
.fab:active{transform:scale(.94);}

.btn{
  font-family:'Zen Kaku Gothic New',sans-serif;
  font-weight:700; font-size:13px;
  padding:11px 16px; border-radius:2px; border:1.5px solid var(--ink);
  background:var(--ink); color:var(--white);
  cursor:pointer; width:100%;
}
.btn.ghost{background:transparent; color:var(--ink);}
.btn.hanko{background:var(--hanko); border-color:var(--hanko);}
.btn:active{opacity:.85;}
.btn:disabled{opacity:.4; cursor:default;}

input[type=text], input[type=date], input[type=time], input[type=password], textarea, select{
  width:100%; font-family:inherit; font-size:14px;
  border:1px solid var(--line); background:var(--white);
  border-radius:2px; padding:10px 10px; margin-bottom:10px; color:var(--ink);
}
label.f{font-size:11px; color:var(--ink-soft); display:block; margin-bottom:4px; font-weight:700;}
.field{margin-bottom:12px;}
.row2{display:flex; gap:8px;}
.row2 > *{flex:1;}

.check{
  width:20px;height:20px; border:1.5px solid var(--ink); border-radius:50%;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer;
  background:var(--white);
}
.check.on{background:var(--sage); border-color:var(--sage); color:white; font-size:12px;}

/* modal */
.overlay{
  position:absolute; inset:0; background:rgba(35,42,37,.42);
  display:flex; align-items:flex-end; z-index:20;
}
.sheet{
  width:100%; background:var(--paper); border-top:2px solid var(--ink);
  border-radius:10px 10px 0 0; padding:18px 18px 22px; max-height:82%; overflow-y:auto;
  animation:up .22s ease-out;
}
@keyframes up{from{transform:translateY(24px); opacity:0} to{transform:translateY(0); opacity:1}}
.sheet h3{font-family:'Shippori Mincho',serif; margin:0 0 14px; font-size:16px;}

/* calendar grid */
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:6px;}
.cal-dow{text-align:center; font-size:10px; color:var(--ink-soft); font-weight:700; padding-bottom:4px;}
.cal-day{
  aspect-ratio:1; background:var(--white); border:1px solid var(--line); border-radius:2px;
  font-size:11px; padding:3px; position:relative; color:var(--ink-soft); cursor:pointer;
}
.cal-day.pad{background:transparent; border-color:transparent;}
.cal-day.today{border-color:var(--hanko); border-width:1.5px; color:var(--ink); font-weight:700;}
.cal-day .dot{position:absolute; bottom:3px; left:3px; right:3px; height:3px; border-radius:2px; background:var(--pen-blue); opacity:.7;}
.cal-day.sel{background:var(--hanko-soft);}

/* timetable */
.tt-wrap{overflow-x:auto;}
.tt-grid{display:grid; grid-template-columns:34px repeat(6,1fr); gap:3px; min-width:520px;}
.tt-h{text-align:center; font-size:11px; font-weight:700; color:var(--ink-soft); padding:6px 0;}
.tt-period{font-size:10px; color:var(--ink-soft); display:flex; align-items:center; justify-content:center;}
.tt-cell{
  background:var(--white); border:1px solid var(--line); border-radius:2px; min-height:52px;
  padding:5px; font-size:11px; cursor:pointer; display:flex; flex-direction:column; justify-content:center;
}
.tt-cell.empty{color:var(--line); justify-content:center; align-items:center;}
.tt-cell b{font-size:12px; display:block;}
.tt-cell span{color:var(--ink-soft); font-size:10px;}

/* stamp animation */
.stamp-wrap{position:relative; display:flex; align-items:center; justify-content:center; height:180px;}
.stamp{
  width:120px; height:120px; border-radius:50%; border:4px solid var(--hanko); color:var(--hanko);
  display:flex; align-items:center; justify-content:center; font-family:'Zen Old Mincho',serif;
  font-size:28px; font-weight:700; transform:rotate(-14deg) scale(2.6); opacity:0;
  animation:stampdown .5s cubic-bezier(.2,1.4,.4,1) forwards; animation-delay:.15s;
}
@keyframes stampdown{ to{ transform:rotate(-14deg) scale(1); opacity:1; } }

/* upload dropzone */
.dropzone{
  border:1.5px dashed var(--line); border-radius:4px; padding:34px 14px; text-align:center;
  color:var(--ink-soft); font-size:13px; cursor:pointer; background:var(--white); margin-bottom:14px;
}
.dropzone svg{stroke:var(--ink-soft); width:30px; height:30px; margin-bottom:8px;}
.preview-img{width:100%; border-radius:4px; border:1px solid var(--line); margin-bottom:14px; max-height:220px; object-fit:cover;}

/* progress steps */
.steps{display:flex; flex-direction:column; gap:10px; margin:20px 0;}
.step{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--line);}
.step .dot{width:9px;height:9px;border-radius:50%; border:1.5px solid var(--line); flex-shrink:0;}
.step.active{color:var(--ink);}
.step.active .dot{background:var(--pen-blue); border-color:var(--pen-blue);}
.step.done{color:var(--sage);}
.step.done .dot{background:var(--sage); border-color:var(--sage);}

.empty-state{text-align:center; padding:50px 20px; color:var(--ink-soft);}
.empty-state svg{width:38px;height:38px;stroke:var(--line); margin-bottom:10px;}
.empty-state p{font-size:13px; margin:0;}

.toast{
  position:absolute; left:50%; bottom:78px; transform:translateX(-50%);
  background:var(--ink); color:var(--white); font-size:12px; font-weight:700;
  padding:9px 16px; border-radius:20px; z-index:40; opacity:0; pointer-events:none;
  transition:opacity .25s, transform .25s;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

.badge-count{
  position:absolute; top:-4px; right:-6px; background:var(--hanko); color:white;
  font-size:9px; border-radius:8px; padding:1px 5px; font-weight:700;
}
.candidate{border:1px solid var(--line); border-radius:3px; padding:10px; margin-bottom:8px; background:var(--white);}
.candidate .top{display:flex; gap:8px; align-items:flex-start;}
.candidate input[type=text]{margin-bottom:6px;}
.link-btn{background:none;border:none;color:var(--pen-blue); font-size:12px; font-weight:700; padding:6px 0; cursor:pointer; font-family:inherit;}

/* project progress */
.progress-track{height:5px; background:var(--paper-2); border-radius:3px; overflow:hidden; margin-top:8px;}
.progress-fill{height:100%; background:var(--pen-blue); border-radius:3px;}

/* header right side */
.title-right{display:flex; align-items:center; gap:10px;}
.icon-btn{
  background:none; border:none; padding:0; cursor:pointer; display:flex;
  width:22px; height:22px; color:var(--ink-soft);
}
.icon-btn svg{width:22px; height:22px; stroke:currentColor; fill:none;}
.icon-btn.on{color:var(--hanko);}

/* month / week / day switch */
.viewswitch{display:flex; gap:0; border:1px solid var(--line); border-radius:2px; overflow:hidden; margin-bottom:12px;}
.viewswitch-btn{
  flex:1; padding:7px 0; border:none; background:var(--white); cursor:pointer;
  font-family:'Zen Kaku Gothic New',sans-serif; font-size:12px; font-weight:700; color:var(--ink-soft);
  border-right:1px solid var(--line);
}
.viewswitch-btn:last-child{border-right:none;}
.viewswitch-btn.on{background:var(--ink); color:var(--white);}

/* due-soon panel */
.due-panel{border:1px solid var(--hanko); border-radius:var(--radius); padding:10px 12px; margin-bottom:14px; background:var(--white);}
.due-head{font-size:11px; font-weight:700; color:var(--hanko); margin-bottom:6px; letter-spacing:.04em;}
.due-row{display:flex; gap:8px; align-items:baseline; padding:4px 0; cursor:pointer; border-top:1px dashed var(--line);}
.due-row:first-of-type{border-top:none;}
.due-when{font-size:10px; font-weight:700; color:var(--pen-blue); flex-shrink:0; min-width:52px;}
.due-row.late .due-when{color:var(--danger);}
.due-title{font-size:13px; font-weight:500; line-height:1.4;}

/* overdue tasks */
.card.overdue::after{background:var(--danger);}
.chip.late{color:var(--danger); border-color:var(--danger);}
.late-text{color:var(--danger); font-weight:700;}

/* lessons pulled in from the timetable */
.card.lesson{background:var(--paper-2);}
.card.lesson::after{background:var(--sage); opacity:.4;}
.chip.lesson{color:var(--sage); border-color:var(--sage);}

/* week view */
.week-day{margin-bottom:14px;}
.week-head{
  font-size:12px; font-weight:700; color:var(--ink-soft); padding:4px 0 6px;
  border-bottom:1px dashed var(--line); margin-bottom:8px; cursor:pointer;
}
.week-day.today .week-head{color:var(--hanko);}
.week-none{font-size:12px; color:var(--line); padding:2px 0 6px;}

/* day view */
.hour-grid{display:grid; grid-template-columns:34px 1fr; gap:0 8px;}
.hour-label{
  font-size:10px; color:var(--ink-soft); text-align:right; padding-top:6px;
  font-variant-numeric:tabular-nums; border-top:1px dashed var(--line);
}
.hour-slot{min-height:36px; padding-top:6px; border-top:1px dashed var(--line);}

/* search filters */
.filter-row{display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap;}
.filter-chip{
  font-family:'Zen Kaku Gothic New',sans-serif; font-size:11px; font-weight:700;
  padding:5px 11px; border-radius:2px; border:1px solid var(--line);
  background:var(--white); color:var(--ink-soft); cursor:pointer;
}
.filter-chip.on{background:var(--ink); border-color:var(--ink); color:var(--white);}

/* checkbox row */
.toggle{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; cursor:pointer;}
.toggle input{width:17px; height:17px; accent-color:var(--hanko); margin:0;}

/* keyboard focus */
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible,
.cal-day:focus-visible, .card:focus-visible{
  outline:2px solid var(--pen-blue); outline-offset:2px;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
}
</style>
</head>
<body>

<div class="frame" id="frame">
  <div class="topbar">
    <div class="brand">他力本願カレンダー <small id="userTag"></small></div>
    <div class="screen-title">
      <span id="screenTitle">カレンダー</span>
      <span class="title-right">
        <button class="icon-btn" id="searchBtn" aria-label="検索"></button>
        <span class="idx" id="screenIdx">1</span>
      </span>
    </div>
  </div>
  <div class="main" id="main"></div>
  <div class="tabbar" id="tabbar"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ============ ICONS ============ */
const ICONS = {
  cal: `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="1.5"/><path d="M3.5 9.5h17"/><path d="M8 3v4M16 3v4"/></svg>`,
  grid: `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="1.5"/><path d="M3.5 9.5h17M3.5 15.5h17M9.5 3.5v17M15.5 3.5v17"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>`,
  cam: `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.4"/></svg>`,
  users: `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.6"/><path d="M15.5 14.2c2.7.3 4.7 2.5 4.7 5.8"/></svg>`,
  gear: `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.13-1.34l2-1.56-2-3.46-2.36.95a7 7 0 0 0-2.32-1.34L13.8 3h-3.6l-.4 2.25a7 7 0 0 0-2.32 1.34l-2.36-.95-2 3.46 2 1.56A7 7 0 0 0 5 12c0 .45.05.9.13 1.34l-2 1.56 2 3.46 2.36-.95c.68.57 1.47 1.02 2.32 1.34L10.2 21h3.6l.4-2.25a7 7 0 0 0 2.32-1.34l2.36.95 2-3.46-2-1.56C18.95 12.9 19 12.45 19 12z"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  x: `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  arrow: `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>`,
  photo: `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 16l-5.5-5.5a1.5 1.5 0 0 0-2.1 0L4 19"/></svg>`,
  trash: `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.6c0-.6.5-1.1 1.1-1.1h3.8c.6 0 1.1.5 1.1 1.1V7M18 7l-.8 12.2A2 2 0 0 1 15.2 21H8.8a2 2 0 0 1-2-1.8L6 7"/></svg>`,
  folder: `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6.6a1.6 1.6 0 0 1 1.6-1.6h4.3l2.1 2.3h7.4a1.6 1.6 0 0 1 1.6 1.6v8.9a1.6 1.6 0 0 1-1.6 1.6H5.1a1.6 1.6 0 0 1-1.6-1.6V6.6z"/></svg>`,
  search: `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.3"/><path d="M15.6 15.6L20.5 20.5"/></svg>`,
};

/* ============ STATE ============ */
let DB = { events:[], tasks:[], timetable:[], colonies:[], projects:[], user:null };
let sess = { tab:'cal', selectedDate: todayStr(), calMonth:new Date(), calView:'month', modal:null, printFlow:null, query:'' };

function uid(){ return 'id_'+Math.random().toString(36).slice(2,10); }

/* ============ DATES ============ */
// toISOString() は UTC 基準なので、日本時間だと朝 9 時前に前日の日付が返る。
// 「今日」がずれると期限の判定まで巻き添えになるので、端末のローカル日付で扱う。
function ymd(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function todayStr(){ return ymd(new Date()); }
function parseDate(s){ return new Date(s+'T00:00:00'); }
function addDays(s,n){ const d=parseDate(s); d.setDate(d.getDate()+n); return ymd(d); }
const DOW_JP = ['日','月','火','水','木','金','土'];
function fmtDate(s){ const d=parseDate(s); return `${d.getMonth()+1}/${d.getDate()}(${DOW_JP[d.getDay()]})`; }

/* ============ 予定の組み立て ============ */
// カレンダーに出る予定は3種類ある。手で入れた単発の予定、繰り返しのその日の分、
// そして時間割から導いた授業。授業と繰り返しは実データとして増やさず、
// 表示するときに毎回組み立てる（同じ予定が二重に増えるのを避けるため）。

// 各限の開始時刻。学校ごとに違うので、変えるならここだけ直せばよい。
const PERIOD_START = {1:'08:50', 2:'09:50', 3:'10:50', 4:'11:50', 5:'13:30', 6:'14:30'};

// 繰り返し予定がその日に発生するか。初回の日も対象に含む。
function repeatsOn(ev, dateStr){
  const r = ev.repeat;
  if(!r) return false;
  const start = ev.startAt.slice(0,10);
  if(dateStr < start) return false;
  if(r.until && dateStr > r.until) return false;
  if((ev.exdates||[]).includes(dateStr)) return false;   // この回だけ消された
  const a = parseDate(start), b = parseDate(dateStr);
  if(r.freq==='daily')   return true;
  if(r.freq==='weekly')  return a.getDay()  === b.getDay();
  if(r.freq==='monthly') return a.getDate() === b.getDate();
  return false;
}
// 繰り返しの1回分。元の予定と区別できるよう occurrenceDate を持たせる。
function occurrenceOf(ev, dateStr){
  return {...ev, occurrenceDate:dateStr, startAt: dateStr + ev.startAt.slice(10)};
}
// 時間割は dayOfWeek が 1=月〜6=土 で、Date#getDay() とそのまま一致する。
// 日曜は該当するコマが無いので自然に空になる。
function timetableEventsFor(dateStr){
  const dow = parseDate(dateStr).getDay();
  return DB.timetable.filter(e=>e.dayOfWeek===dow).map(e=>({
    id: 'tt_'+e.id+'_'+dateStr,
    title: e.subject,
    description: [e.room, e.teacher].filter(Boolean).join('・'),
    startAt: dateStr+'T'+(PERIOD_START[e.period] || '08:50'),
    allDay: false,
    source: 'timetable',
    period: e.period,
    readOnly: true,
  }));
}
// その日に出るものを全部集めて、終日を先頭に、あとは時刻順で返す。
function eventsForDate(dateStr){
  const out = [];
  DB.events.forEach(ev=>{
    if(ev.repeat){
      if(repeatsOn(ev, dateStr)) out.push(occurrenceOf(ev, dateStr));
    }else if(ev.startAt.slice(0,10)===dateStr){
      out.push(ev);
    }
  });
  out.push(...timetableEventsFor(dateStr));
  return out.sort((a,b)=>
    (b.allDay?1:0)-(a.allDay?1:0) || a.startAt.localeCompare(b.startAt));
}

async function loadAll(){
  const keys = ['events','tasks','timetable','colonies','projects','user'];
  for(const k of keys){
    try{
      const r = await window.storage.get(k, false);
      if(r && r.value) DB[k] = JSON.parse(r.value);
    }catch(e){ /* not found yet, keep default */ }
  }
  if(!DB.events) DB.events=[]; if(!DB.tasks) DB.tasks=[]; if(!DB.timetable) DB.timetable=[]; if(!DB.colonies) DB.colonies=[]; if(!DB.projects) DB.projects=[];
}
async function save(key){
  try{ await window.storage.set(key, JSON.stringify(DB[key]), false); }catch(e){ console.error('save failed',key,e); }
}

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1800);
}

/* ============ RENDER ROOT ============ */
const TITLES = { cal:'カレンダー', tt:'時間割', task:'タスク一覧', proj:'プロジェクト', print:'プリント取込', colony:'コロニー', settings:'設定', search:'検索' };
const IDXMAP = { cal:'1', tt:'2', task:'3', proj:'4', print:'5', colony:'6', settings:'7', search:'?' };
const TABS = [
  {k:'cal', icon:ICONS.cal, label:'カレンダー'},
  {k:'tt', icon:ICONS.grid, label:'時間割'},
  {k:'task', icon:ICONS.check, label:'タスク'},
  {k:'proj', icon:ICONS.folder, label:'プロジェクト'},
  {k:'print', icon:ICONS.cam, label:'プリント'},
  {k:'colony', icon:ICONS.users, label:'コロニー'},
  {k:'settings', icon:ICONS.gear, label:'設定'},
];

function render(){
  const main = document.getElementById('main');
  const tabbar = document.getElementById('tabbar');
  const titleEl = document.getElementById('screenTitle');
  const idxEl = document.getElementById('screenIdx');
  const userTag = document.getElementById('userTag');

  if(!DB.user){
    tabbar.style.display='none';
    document.querySelector('.topbar').style.display='none';
    main.style.padding='0';
    main.innerHTML = renderLogin();
    bindLogin();
    return;
  }
  document.querySelector('.topbar').style.display='block';
  tabbar.style.display='flex';
  main.style.padding='16px 16px 24px';
  userTag.textContent = 'ようこそ、'+DB.user.name+'さん';
  titleEl.textContent = TITLES[sess.tab];
  idxEl.textContent = IDXMAP[sess.tab];

  tabbar.innerHTML = TABS.map(t=>`
    <button class="tab ${sess.tab===t.k?'active':''}" data-tab="${t.k}">
      ${t.icon}<span>${t.label}</span>
    </button>`).join('');
  tabbar.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ sess.tab=b.dataset.tab; sess.modal=null; render(); });

  const searchBtn = document.getElementById('searchBtn');
  searchBtn.innerHTML = ICONS.search;
  searchBtn.classList.toggle('on', sess.tab==='search');
  searchBtn.onclick = ()=>{
    sess.tab = sess.tab==='search' ? 'cal' : 'search';
    sess.modal = null;
    render();
    const q = document.getElementById('searchInput');
    if(q) q.focus();
  };

  let html = '';
  if(sess.tab==='cal') html = renderCalendar();
  else if(sess.tab==='tt') html = renderTimetable();
  else if(sess.tab==='task') html = renderTasks();
  else if(sess.tab==='proj') html = renderProjects();
  else if(sess.tab==='print') html = renderPrint();
  else if(sess.tab==='colony') html = renderColony();
  else if(sess.tab==='settings') html = renderSettings();
  else if(sess.tab==='search') html = renderSearch();

  main.innerHTML = html;
  bindScreen();
  renderModal();
}

/* ============ CALENDAR ============ */
const CAL_VIEWS = [{k:'month',label:'月'},{k:'week',label:'週'},{k:'day',label:'日'}];

function renderCalendar(){
  const view = sess.calView;
  const body = view==='week' ? renderWeekView()
             : view==='day'  ? renderDayView()
             : renderMonthView();
  return `
    <div class="viewswitch">
      ${CAL_VIEWS.map(v=>`<button class="viewswitch-btn ${view===v.k?'on':''}" data-view="${v.k}">${v.label}</button>`).join('')}
    </div>
    ${renderDueSummary()}
    ${body}
    <button class="fab" id="addEventFab">${ICONS.plus}</button>
  `;
}

// 期限が今日・明日のタスクと、過ぎてしまったタスクを画面の先頭に出す。
// アプリを開いた人が最初に見る場所なので、ここに無いものは気付かれない。
function renderDueSummary(){
  const today = todayStr(), tomorrow = addDays(today,1);
  const open = DB.tasks.filter(t=>t.status==='OPEN' && t.dueAt);
  const overdue = open.filter(t=>t.dueAt <  today).sort((a,b)=>a.dueAt.localeCompare(b.dueAt));
  const soon    = open.filter(t=>t.dueAt === today || t.dueAt === tomorrow)
                      .sort((a,b)=>a.dueAt.localeCompare(b.dueAt));
  if(!overdue.length && !soon.length) return '';
  const line = (t)=>{
    const late = t.dueAt < today;
    const when = t.dueAt===today ? '今日' : t.dueAt===tomorrow ? '明日'
               : `${-diffDays(today,t.dueAt)}日超過`;
    return `<div class="due-row ${late?'late':''}" data-task="${t.id}">
      <span class="due-when">${when}</span>
      <span class="due-title">${esc(t.title)}</span>
    </div>`;
  };
  return `
    <div class="due-panel">
      <div class="due-head">${overdue.length? `期限切れ ${overdue.length} 件・`:''}まもなく ${soon.length} 件</div>
      ${overdue.map(line).join('')}
      ${soon.map(line).join('')}
    </div>`;
}
function diffDays(a,b){ return Math.round((parseDate(b)-parseDate(a))/86400000); }

function renderMonthView(){
  const m = sess.calMonth;
  const y=m.getFullYear(), mo=m.getMonth();
  const startPad = new Date(y,mo,1).getDay();
  const daysInMonth = new Date(y,mo+1,0).getDate();
  const cells=[];
  for(let i=0;i<startPad;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);

  let grid = `<div class="cal-grid">` + DOW_JP.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  cells.forEach(d=>{
    if(d===null){ grid+=`<div class="cal-day pad"></div>`; return; }
    const dateStr = `${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has = eventsForDate(dateStr).length>0;
    grid += `<div class="cal-day ${dateStr===todayStr()?'today':''} ${dateStr===sess.selectedDate?'sel':''}" data-date="${dateStr}">${d}${has?'<div class="dot"></div>':''}</div>`;
  });
  grid += `</div>`;

  const dayEvents = eventsForDate(sess.selectedDate);
  return `
    ${navRow(`${y}年 ${mo+1}月`)}
    ${grid}
    <div class="section-label">${fmtDate(sess.selectedDate)} の予定</div>
    ${dayEvents.length? dayEvents.map(evCard).join('') : emptyState('この日は予定がありません')}
  `;
}

// 週表示。1日ずつ見出しを立てて、その日の予定をぶら下げる。
function renderWeekView(){
  const base = parseDate(sess.selectedDate);
  const start = addDays(sess.selectedDate, -base.getDay());   // その週の日曜
  const days = Array.from({length:7}, (_,i)=>addDays(start,i));
  const label = `${fmtDate(start)} 〜 ${fmtDate(days[6])}`;
  return `
    ${navRow(label)}
    ${days.map(d=>{
      const evs = eventsForDate(d);
      return `<div class="week-day ${d===todayStr()?'today':''}">
        <div class="week-head" data-date="${d}">${fmtDate(d)}</div>
        ${evs.length? evs.map(evCard).join('')
                    : `<div class="week-none">予定なし</div>`}
      </div>`;
    }).join('')}
  `;
}

// 日表示。時間軸に沿って並べるので、空き時間の形が見える。
function renderDayView(){
  const d = sess.selectedDate;
  const evs = eventsForDate(d);
  const timed  = evs.filter(e=>!e.allDay);
  const allDay = evs.filter(e=>e.allDay);
  const from = timed.length ? Math.min(8, +timed[0].startAt.slice(11,13)) : 8;
  const to   = timed.length ? Math.max(19, +timed[timed.length-1].startAt.slice(11,13)+1) : 19;
  const hours = [];
  for(let h=from; h<=to; h++) hours.push(h);
  return `
    ${navRow(fmtDate(d))}
    ${allDay.length? `<div class="section-label">終日</div>${allDay.map(evCard).join('')}` : ''}
    <div class="hour-grid">
      ${hours.map(h=>{
        const inHour = timed.filter(e=>+e.startAt.slice(11,13)===h);
        return `<div class="hour-label">${String(h).padStart(2,'0')}</div>
          <div class="hour-slot">${inHour.map(evCard).join('')}</div>`;
      }).join('')}
    </div>
  `;
}

function navRow(label){
  return `<div class="label-row" style="justify-content:space-between; margin-bottom:10px;">
    <button class="link-btn" data-nav="-1">${ICONS.arrow}</button>
    <div style="font-weight:700; font-family:'Shippori Mincho',serif;">${label}</div>
    <button class="link-btn" data-nav="1" style="transform:scaleX(-1);">${ICONS.arrow}</button>
  </div>`;
}
function evCard(e){
  const time = e.allDay? '終日' : e.startAt.slice(11,16);
  const lesson = e.source==='timetable';
  // 授業は時間割から導いたものなので、ここからは編集させない（時間割タブで直す）。
  const attr = lesson ? '' : ` data-ev="${e.id}"${e.occurrenceDate?` data-occ="${e.occurrenceDate}"`:''}`;
  return `<div class="card ${lesson?'lesson':''} ${e.sourcePrintId?'ai':''}"${attr}>
    <div class="label-row">
      ${lesson? `<span class="chip lesson">${e.period}限</span>`:''}
      ${e.sourcePrintId?'<span class="chip ai">AI取込</span>':''}
      ${e.repeat?'<span class="chip blue">繰り返し</span>':''}
      <span class="chip blue">${time}</span>
    </div>
    <div class="title-row"><div class="item-title">${esc(e.title)}</div></div>
    ${e.description? `<div class="item-sub">${esc(e.description)}</div>`:''}
  </div>`;
}
function emptyState(msg){
  return `<div class="empty-state">${ICONS.cal}<p>${msg}</p></div>`;
}
function esc(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* ============ TIMETABLE ============ */
const DOWS = ['月','火','水','木','金','土'];
function renderTimetable(){
  const periods = [1,2,3,4,5,6];
  const byCell = {};
  DB.timetable.forEach(e=>{ byCell[e.dayOfWeek+'_'+e.period]=e; });
  let rows = '';
  periods.forEach(p=>{
    rows += `<div class="tt-period">${p}</div>`;
    for(let d=1; d<=6; d++){
      const e = byCell[d+'_'+p];
      rows += e
        ? `<div class="tt-cell" data-edit="${d}_${p}"><b>${esc(e.subject)}</b><span>${esc(e.room)}</span></div>`
        : `<div class="tt-cell empty" data-edit="${d}_${p}">+</div>`;
    }
  });
  return `
    <div class="tt-wrap">
      <div class="tt-grid">
        <div></div>${DOWS.map(d=>`<div class="tt-h">${d}</div>`).join('')}
        ${rows}
      </div>
    </div>
    <div class="section-label">使い方</div>
    <div class="item-sub" style="line-height:1.7;">空いているマスをタップしてコマを登録。登録済みのマスをタップすると編集・削除ができます。</div>
  `;
}

/* ============ TASKS ============ */
function renderTasks(){
  const open = DB.tasks.filter(t=>t.status==='OPEN').sort((a,b)=>(a.dueAt||'').localeCompare(b.dueAt||''));
  const done = DB.tasks.filter(t=>t.status==='DONE');
  return `
    <div class="section-label">未完了（${open.length}）</div>
    ${open.length? open.map(taskCard).join('') : emptyState('未完了のタスクはありません')}
    ${done.length? `<div class="section-label">完了済み（${done.length}）</div>` + done.map(taskCard).join('') : ''}
    <button class="fab" id="addTaskFab">${ICONS.plus}</button>
  `;
}
function taskCard(t){
  const isDone = t.status==='DONE';
  const proj = t.projectId? DB.projects.find(p=>p.id===t.projectId) : null;
  const overdue = !isDone && t.dueAt && t.dueAt < todayStr();
  return `<div class="card ${isDone?'done':''} ${overdue?'overdue':''} ${t.ai?'ai':''}" data-task="${t.id}">
    <div class="title-row">
      <div style="display:flex; gap:10px; align-items:flex-start; flex:1;">
        <div class="check ${isDone?'on':''}" data-toggle="${t.id}">${isDone? '済':''}</div>
        <div style="flex:1;">
          <div class="label-row">${t.ai?'<span class="chip ai">AI取込</span>':''}${proj?`<span class="chip proj">${esc(proj.name)}</span>`:''}${overdue?'<span class="chip late">期限切れ</span>':''}</div>
          <div class="item-title ${isDone?'strike':''}">${esc(t.title)}</div>
          ${t.description? `<div class="item-sub">${esc(t.description)}</div>`:''}
          ${t.dueAt? `<div class="item-sub ${overdue?'late-text':''}">期限：${fmtDate(t.dueAt)}</div>`:''}
        </div>
      </div>
      <button class="link-btn" data-deltask="${t.id}">${ICONS.trash}</button>
    </div>
  </div>`;
}

/* ============ SEARCH ============ */
const SEARCH_FILTERS = [{k:'all',label:'すべて'},{k:'open',label:'未完了'},{k:'done',label:'完了'}];

function renderSearch(){
  const raw = sess.query || '';
  const q = raw.trim().toLowerCase();
  const filter = sess.searchFilter || 'all';
  const head = `
    <input type="text" id="searchInput" placeholder="タスク・予定を検索" value="${esc(raw)}" autocomplete="off">
    <div class="filter-row">
      ${SEARCH_FILTERS.map(f=>`<button class="filter-chip ${filter===f.k?'on':''}" data-filter="${f.k}">${f.label}</button>`).join('')}
    </div>`;
  if(!q) return head + emptyState('探したい言葉を入れてください');

  const hit = (s)=> (s||'').toLowerCase().includes(q);

  let tasks = DB.tasks.filter(t=>hit(t.title) || hit(t.description));
  if(filter==='open') tasks = tasks.filter(t=>t.status==='OPEN');
  if(filter==='done') tasks = tasks.filter(t=>t.status==='DONE');
  tasks.sort((a,b)=>(a.dueAt||'').localeCompare(b.dueAt||''));

  // 予定には完了・未完了が無いので、状態で絞っているときは対象から外す。
  const events = filter==='all'
    ? DB.events.filter(e=>hit(e.title) || hit(e.description))
               .sort((a,b)=>a.startAt.localeCompare(b.startAt))
    : [];

  if(!tasks.length && !events.length){
    return head + emptyState(`「${esc(raw.trim())}」に一致するものはありません`);
  }
  return head
    + (tasks.length ? `<div class="section-label">タスク（${tasks.length}）</div>` + tasks.map(taskCard).join('') : '')
    + (events.length? `<div class="section-label">予定（${events.length}）</div>` + events.map(evCard).join('') : '');
}

/* ============ PROJECTS ============ */
function renderProjects(){
  if(sess.projectDetail){
    const p = DB.projects.find(x=>x.id===sess.projectDetail);
    if(!p){ sess.projectDetail=null; return renderProjects(); }
    const tasks = DB.tasks.filter(t=>t.projectId===p.id);
    const done = tasks.filter(t=>t.status==='DONE').length;
    const pct = tasks.length? Math.round(done/tasks.length*100) : 0;
    return `
      <button class="link-btn" id="backProject">${ICONS.arrow} プロジェクト一覧へ</button>
      <div class="title-row" style="align-items:center; margin-top:10px;">
        <div style="font-family:'Shippori Mincho',serif; font-weight:800; font-size:19px;">${esc(p.name)}</div>
        <button class="link-btn" id="editProject">編集</button>
      </div>
      ${p.description? `<div class="item-sub" style="margin-bottom:10px;">${esc(p.description)}</div>`:''}
      <div class="item-sub">進捗　${done} / ${tasks.length}（${pct}%）</div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
      <div class="section-label" style="margin-top:18px;">タスク</div>
      ${tasks.length? tasks.map(taskCard).join('') : emptyState('このプロジェクトのタスクはまだありません')}
      <button class="btn ghost" id="addTaskToProject">このプロジェクトにタスクを追加</button>
      <button class="btn ghost" style="margin-top:8px; color:var(--danger); border-color:var(--danger);" id="delProject">プロジェクトを削除</button>
    `;
  }
  return `
    <div class="section-label">プロジェクト一覧</div>
    ${DB.projects.length? DB.projects.map(projectCard).join('') : emptyState('プロジェクトはまだありません')}
    <button class="fab" id="addProjectFab">${ICONS.plus}</button>
  `;
}
function projectCard(p){
  const tasks = DB.tasks.filter(t=>t.projectId===p.id);
  const done = tasks.filter(t=>t.status==='DONE').length;
  const pct = tasks.length? Math.round(done/tasks.length*100) : 0;
  return `<div class="card" data-project="${p.id}">
    <div class="title-row"><div class="item-title">${esc(p.name)}</div><span class="chip proj">${done}/${tasks.length}</span></div>
    ${p.description? `<div class="item-sub">${esc(p.description)}</div>`:''}
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
  </div>`;
}

function renderPrint(){

    return `

        ${ICONS.photo}

      </div>

      ${DB.tasks.filter(t=>t.ai).length===0 && DB.events.filter(e=>e.sourcePrintId).length===0
        ? emptyState('まだAI取り込みの実績がありません')
        : (DB.tasks.filter(t=>t.ai).map(taskCard).join('') + DB.events.filter(e=>e.sourcePrintId).map(evCard).join(''))
      }
    `;
  }
  if(flow.step==='preview'){
    return `
      <img class="preview-img" src="${flow.imgSrc}">

      <button class="btn ghost" style="margin-top:8px;" id="cancelFlow">キャンセル</button>
    `;
  }
  if(flow.step==='processing'){
    return `
      <img class="preview-img" src="${flow.imgSrc}" style="max-height:140px;">
      <div class="steps">
        <div class="step ${flow.sub>=0?'done':''}"><div class="dot"></div>アップロード完了</div>
        <div class="step ${flow.sub>=1?(flow.sub===1?'active':'done'):''}"><div class="dot"></div>解析待ち（QUEUED）</div>
        <div class="step ${flow.sub>=2?(flow.sub===2?'active':'done'):''}"><div class="dot"></div>AIが読み取り中（PROCESSING）</div>
      </div>
      <div class="item-sub" style="text-align:center;">しばらくお待ちください…</div>
    `;
  }
  if(flow.step==='review'){
    return `
      <div class="label-row"><span class="chip ai">REVIEW_REQUIRED</span></div>
      <div class="item-sub" style="margin-bottom:14px;">AIがこのプリントから次の項目を見つけました。内容を確認・修正してから登録してください。</div>
      ${flow.candidates.map((c,i)=>`
        <div class="candidate">
          <div class="top">
            <div class="check ${c.include?'on':''}" data-cand-toggle="${i}">${c.include?'済':''}</div>
            <div style="flex:1;">
              <div class="label-row"><span class="chip ${c.type==='task'?'blue':'ai'}">${c.type==='task'?'タスク':'予定'}</span></div>
              <input type="text" data-cand-title="${i}" value="${esc(c.title)}">
              <div class="row2">
                <input type="date" data-cand-date="${i}" value="${c.date}">
                ${c.type==='event'? `<input type="time" data-cand-time="${i}" value="${c.time||'09:00'}">` : ''}
              </div>
            </div>
          </div>
        </div>
      `).join('')}
      <button class="btn hanko" id="commitBtn">確定印を押す</button>
      <button class="btn ghost" style="margin-top:8px;" id="retryBtn">もう一度解析する</button>
    `;
  }
  if(flow.step==='stamping'){
    return `<div class="stamp-wrap"><div class="stamp">済</div></div>`;
  }
  if(flow.step==='done'){
    return `
      <div class="stamp-wrap" style="height:100px;"><div class="stamp" style="animation:none; opacity:1; transform:rotate(-14deg) scale(1);">済</div></div>
      <div style="text-align:center; font-weight:700; margin-bottom:6px;">登録が完了しました</div>
      <div class="item-sub" style="text-align:center; margin-bottom:20px;">${flow.committedCount}件をカレンダー / タスクに追加しました</div>
      <button class="btn ghost" id="backToCal">カレンダーで見る</button>
      <button class="btn hanko" style="margin-top:8px;" id="finishFlow">閉じる</button>
    `;
  }
}

function renderModal(){
  const root = document.getElementById('frame');
  let existing = document.getElementById('modalOverlay');
  if(existing) existing.remove();
  if(!sess.modal) return;
  const div = document.createElement('div');
  div.className='overlay'; div.id='modalOverlay';
  div.innerHTML = `<div class="sheet">${modalContent()}</div>`;
  root.appendChild(div);
  div.addEventListener('click', e=>{ if(e.target===div){ sess.modal=null; render(); } });
  bindModal();
}

          ${t.dueAt? `<div class="item-sub">期限：${fmtDate(t.dueAt)}</div>`:''}
        </div>`).join('')}

  }
  return '';
}

/* ============ BIND SCREEN EVENTS ============ */
function bindScreen(){
  // calendar
  document.querySelectorAll('.cal-day[data-date]').forEach(el=>{
    el.onclick = ()=>{ sess.selectedDate = el.dataset.date; render(); };
  });
  // 月表示は月送り、週表示は週送り、日表示は日送り。
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=>{
      const step = parseInt(el.dataset.nav);
      if(sess.calView==='month'){
        sess.calMonth.setMonth(sess.calMonth.getMonth()+step);
      }else{
        sess.selectedDate = addDays(sess.selectedDate, step*(sess.calView==='week'?7:1));
        sess.calMonth = parseDate(sess.selectedDate);
      }
      render();
    };
  });
  document.querySelectorAll('[data-view]').forEach(el=>{
    el.onclick = ()=>{ sess.calView = el.dataset.view; render(); };
  });
  document.querySelectorAll('.week-head[data-date]').forEach(el=>{
    el.onclick = ()=>{ sess.selectedDate = el.dataset.date; sess.calView='day'; render(); };
  });
  const addEventFab = document.getElementById('addEventFab');
  if(addEventFab) addEventFab.onclick = ()=>{ sess.modal={kind:'event', data:null}; renderModal(); };
  document.querySelectorAll('[data-ev]').forEach(el=>{
    el.onclick = ()=>{
      const e = DB.events.find(x=>x.id===el.dataset.ev);
      if(!e) return;
      sess.modal = {kind:'event', data:e, occurrenceDate: el.dataset.occ || null, scope:'one'};
      renderModal();
    };
  });

  // timetable
  document.querySelectorAll('[data-edit]').forEach(el=>{
    el.onclick = ()=>{ sess.modal={kind:'ttcell', key:el.dataset.edit}; renderModal(); };
  });

  // tasks
  const addTaskFab = document.getElementById('addTaskFab');
  if(addTaskFab) addTaskFab.onclick = ()=>{ sess.modal={kind:'task', data:null}; renderModal(); };
  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.onclick = async (ev)=>{
      ev.stopPropagation();          // カードを開かずにチェックだけ切り替える
      const t = DB.tasks.find(x=>x.id===el.dataset.toggle);
      t.status = t.status==='DONE'?'OPEN':'DONE';
      await save('tasks'); render(); toast(t.status==='DONE'?'完了にしました':'未完了に戻しました');
    };
  });
  document.querySelectorAll('[data-deltask]').forEach(el=>{
    el.onclick = async (ev)=>{
      ev.stopPropagation();
      DB.tasks = DB.tasks.filter(x=>x.id!==el.dataset.deltask);
      await save('tasks'); render();
    };
  });
  // タスクをタップして編集する。チェックと削除は上で stopPropagation してある。
  document.querySelectorAll('[data-task]').forEach(el=>{
    el.onclick = ()=>{
      const t = DB.tasks.find(x=>x.id===el.dataset.task);
      if(!t) return;
      sess.modal = {kind:'task', data:t};
      renderModal();
    };
  });

  // search
  const searchInput = document.getElementById('searchInput');
  if(searchInput){
    const apply = ()=>{
      sess.query = searchInput.value;
      const pos = searchInput.selectionStart;
      render();
      const next = document.getElementById('searchInput');
      if(next){ next.focus(); next.setSelectionRange(pos,pos); }
    };
    // 日本語入力の変換中に再描画すると入力が壊れるので、確定するまで待つ。
    searchInput.oninput = (ev)=>{ if(!ev.isComposing) apply(); };
    searchInput.addEventListener('compositionend', apply);
  }
  document.querySelectorAll('[data-filter]').forEach(el=>{
    el.onclick = ()=>{ sess.searchFilter = el.dataset.filter; render(); };
  });

  // projects
  const addProjectFab = document.getElementById('addProjectFab');
  if(addProjectFab) addProjectFab.onclick = ()=>{ sess.modal={kind:'project', data:null}; renderModal(); };
  document.querySelectorAll('[data-project]').forEach(el=>{
    el.onclick = ()=>{ sess.projectDetail = el.dataset.project; render(); };
  });
  const backProject = document.getElementById('backProject');
  if(backProject) backProject.onclick = ()=>{ sess.projectDetail=null; render(); };
  const editProject = document.getElementById('editProject');
  if(editProject) editProject.onclick = ()=>{
    const p = DB.projects.find(x=>x.id===sess.projectDetail);
    sess.modal={kind:'project', data:p}; renderModal();
  };
  const addTaskToProject = document.getElementById('addTaskToProject');
  if(addTaskToProject) addTaskToProject.onclick = ()=>{ sess.modal={kind:'task', data:null, projectId:sess.projectDetail}; renderModal(); };
  const delProject = document.getElementById('delProject');
  if(delProject) delProject.onclick = async ()=>{
    const pid = sess.projectDetail;
    DB.projects = DB.projects.filter(x=>x.id!==pid);
    DB.tasks.forEach(t=>{ if(t.projectId===pid) t.projectId=null; });
    await Promise.all(['projects','tasks'].map(save));
    sess.projectDetail=null; render(); toast('プロジェクトを削除しました');
  };

  // print flow
  const dz = document.getElementById('dropzone');
  const fi = document.getElementById('fileInput');
  if(dz) dz.onclick = ()=> fi.click();
  if(fi) fi.onchange = ()=>{
    const file = fi.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ sess.printFlow = {step:'preview', imgSrc:reader.result}; render(); };
    reader.readAsDataURL(file);
  };
  const cancelFlow = document.getElementById('cancelFlow');
  if(cancelFlow) cancelFlow.onclick = ()=>{ sess.printFlow=null; render(); };
  const startAnalysis = document.getElementById('startAnalysis');
  if(startAnalysis) startAnalysis.onclick = ()=>{
    sess.printFlow = {...sess.printFlow, step:'processing', sub:0};
    render();
    setTimeout(()=>{ sess.printFlow.sub=1; render(); },500);
    setTimeout(()=>{ sess.printFlow.sub=2; render(); },1400);
    setTimeout(()=>{ sess.printFlow = {...sess.printFlow, step:'review', candidates:mockCandidates()}; render(); },2600);
  };
  const retryBtn = document.getElementById('retryBtn');
  if(retryBtn) retryBtn.onclick = ()=>{ sess.printFlow.step='processing'; sess.printFlow.sub=1; render();
    setTimeout(()=>{ sess.printFlow.sub=2; render(); },800);
    setTimeout(()=>{ sess.printFlow = {...sess.printFlow, step:'review', candidates:mockCandidates()}; render(); },1800);
  };
  document.querySelectorAll('[data-cand-toggle]').forEach(el=>{
    el.onclick = ()=>{ const i=+el.dataset.candToggle; sess.printFlow.candidates[i].include = !sess.printFlow.candidates[i].include; render(); };
  });
  document.querySelectorAll('[data-cand-title]').forEach(el=>{
    el.oninput = ()=>{ sess.printFlow.candidates[+el.dataset.candTitle].title = el.value; };
  });
  document.querySelectorAll('[data-cand-date]').forEach(el=>{
    el.oninput = ()=>{ sess.printFlow.candidates[+el.dataset.candDate].date = el.value; };
  });
  document.querySelectorAll('[data-cand-time]').forEach(el=>{
    el.oninput = ()=>{ sess.printFlow.candidates[+el.dataset.candTime].time = el.value; };
  });
  const commitBtn = document.getElementById('commitBtn');
  if(commitBtn) commitBtn.onclick = async ()=>{
    const chosen = sess.printFlow.candidates.filter(c=>c.include);
    const printId = uid();
    chosen.forEach(c=>{
      if(c.type==='task') DB.tasks.push({id:uid(), title:c.title, description:'', dueAt:c.date, status:'OPEN', ai:true, sourcePrintId:printId, projectId:null});
      else DB.events.push({id:uid(), title:c.title, description:'', startAt:c.date+'T'+(c.time||'09:00'), allDay:false, sourcePrintId:printId});
    });
    await Promise.all(['tasks','events'].map(save));
    sess.printFlow = {...sess.printFlow, step:'stamping'};
    render();
    setTimeout(()=>{ sess.printFlow = {...sess.printFlow, step:'done', committedCount:chosen.length}; render(); }, 900);
  };
  const backToCal = document.getElementById('backToCal');
  if(backToCal) backToCal.onclick = ()=>{ sess.printFlow=null; sess.tab='cal'; render(); };
  const finishFlow = document.getElementById('finishFlow');
  if(finishFlow) finishFlow.onclick = ()=>{ sess.printFlow=null; render(); };

  // colony
  const addColonyFab = document.getElementById('addColonyFab');
  if(addColonyFab) addColonyFab.onclick = ()=>{ sess.modal={kind:'colony'}; renderModal(); };
  document.querySelectorAll('[data-colony]').forEach(el=>{
    el.onclick = ()=>{ sess.colonyDetail = el.dataset.colony; render(); };
  });
  const backColony = document.getElementById('backColony');
  if(backColony) backColony.onclick = ()=>{ sess.colonyDetail=null; render(); };
  const joinColonyBtn = document.getElementById('joinColonyBtn');
  if(joinColonyBtn) joinColonyBtn.onclick = ()=>{ sess.modal={kind:'joinColony'}; renderModal(); };
  const shareTaskToColony = document.getElementById('shareTaskToColony');
  if(shareTaskToColony) shareTaskToColony.onclick = ()=>{ sess.modal={kind:'pickTask'}; renderModal(); };
  const leaveColony = document.getElementById('leaveColony');
  if(leaveColony) leaveColony.onclick = async ()=>{
    const c = DB.colonies.find(x=>x.id===sess.colonyDetail);
    c.members = (c.members||[]).filter(m=>m.id!==DB.user.id);
    // 最後の1人が抜けたら、誰も入れないコロニーが残らないよう消す。
    if(!c.members.length) DB.colonies = DB.colonies.filter(x=>x.id!==c.id);
    await save('colonies');
    sess.colonyDetail=null; render(); toast('コロニーから抜けました');
  };

  // settings
  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.onclick = ()=>{ DB.user=null; sess.tab='login'; render(); };
}

function bindModal(){
  const m = sess.modal;
  const saveBtn = document.getElementById('m-save');
  const delBtn = document.getElementById('m-del');

  // 終日にしたら時刻欄は要らないので隠す
  const allDayBox = document.getElementById('m-allday');
  if(allDayBox) allDayBox.onchange = ()=>{
    document.getElementById('m-time-field').style.display = allDayBox.checked ? 'none' : '';
  };
  // 繰り返しを選んだときだけ「終わり」を出す
  const repeatSel = document.getElementById('m-repeat');
  if(repeatSel) repeatSel.onchange = ()=>{
    document.getElementById('m-until-field').style.display = repeatSel.value ? '' : 'none';
  };
  document.querySelectorAll('[data-scope]').forEach(el=>{
    el.onclick = ()=>{ sess.modal.scope = el.dataset.scope; renderModal(); };
  });
  // 共有するタスクを選ぶ
  document.querySelectorAll('[data-pick]').forEach(el=>{
    el.onclick = async ()=>{
      const c = DB.colonies.find(x=>x.id===sess.colonyDetail);
      const t = DB.tasks.find(x=>x.id===el.dataset.pick);
      if(!c || !t) return;
      c.feed = c.feed||[];
      if(c.feed.some(f=>f.sourceId===t.id)){ toast('このタスクは共有済みです'); return; }
      c.feed.unshift({sourceType:'task', sourceId:t.id, titleSnapshot:t.title, by:DB.user.name, date:fmtDate(todayStr())});
      await save('colonies');
      sess.modal=null; render(); toast('共有しました');
    };
  });

  if(saveBtn) saveBtn.onclick = async ()=>{
    if(m.kind==='event'){
      const title = document.getElementById('m-title').value.trim();
      if(!title){ toast('タイトルを入力してください'); return; }
      const desc   = document.getElementById('m-desc').value;
      const date   = document.getElementById('m-date').value;
      const allDay = document.getElementById('m-allday').checked;
      const time   = allDay ? '00:00' : document.getElementById('m-time').value;
      const freq   = document.getElementById('m-repeat').value;
      const until  = document.getElementById('m-until').value || null;
      const repeat = freq ? {freq, until} : null;
      const fields = {title, description:desc, startAt:date+'T'+time, allDay};

      if(!m.data){
        DB.events.push({id:uid(), ...fields, repeat, exdates:[], sourcePrintId:null});
      }else if(m.occurrenceDate && m.data.repeat && m.scope!=='all'){
        // この回だけ直す：元の繰り返しからその日を外し、単発の予定として切り出す。
        m.data.exdates = (m.data.exdates||[]).concat(m.occurrenceDate);
        DB.events.push({id:uid(), ...fields, repeat:null, exdates:[], sourcePrintId:m.data.sourcePrintId||null});
      }else{
        Object.assign(m.data, fields, {repeat});
      }
      await save('events');
    }
    if(m.kind==='task'){
      const title = document.getElementById('m-title').value.trim();
      if(!title){ toast('タイトルを入力してください'); return; }
      const fields = {
        title,
        description: document.getElementById('m-desc').value,
        dueAt:       document.getElementById('m-date').value,
        projectId:   document.getElementById('m-project').value || null,
      };
      if(m.data) Object.assign(m.data, fields);
      else DB.tasks.push({id:uid(), ...fields, status:'OPEN', ai:false});
      await save('tasks');
    }
    if(m.kind==='project'){
      const name = document.getElementById('m-pname').value.trim();
      if(!name){ toast('名前を入力してください'); return; }
      const description = document.getElementById('m-pdesc').value;
      if(m.data){ Object.assign(m.data, {name, description}); }
      else DB.projects.push({id:uid(), name, description, createdAt:todayStr()});
      await save('projects');
    }
    if(m.kind==='ttcell'){
      const [d,p] = m.key.split('_');
      const subject = document.getElementById('m-subject').value.trim();
      if(!subject){ toast('教科を入力してください'); return; }
      const room = document.getElementById('m-room').value;
      const teacher = document.getElementById('m-teacher').value;
      let ex = DB.timetable.find(x=>x.dayOfWeek==d && x.period==p);
      if(ex) Object.assign(ex, {subject, room, teacher});
      else DB.timetable.push({id:uid(), dayOfWeek:+d, period:+p, subject, room, teacher});
      await save('timetable');
    }
    if(m.kind==='colony'){
      const name = document.getElementById('m-name').value.trim();
      if(!name){ toast('名前を入力してください'); return; }
      DB.colonies.push({
        id:uid(), name,
        description: document.getElementById('m-desc').value,
        inviteCode: Math.random().toString(36).slice(2,8).toUpperCase(),
        ownerId: DB.user.id,
        members: [{id:DB.user.id, name:DB.user.name}],
        feed: [],
      });
      await save('colonies');
    }
    if(m.kind==='joinColony'){
      const code = document.getElementById('m-code').value.trim().toUpperCase();
      if(!code){ toast('招待コードを入力してください'); return; }
      const c = DB.colonies.find(x=>x.inviteCode===code);
      if(!c){ toast('そのコードのコロニーは見つかりません'); return; }
      if(isMember(c)){ toast('すでに参加しています'); return; }
      c.members = (c.members||[]).concat({id:DB.user.id, name:DB.user.name});
      await save('colonies');
      sess.modal=null; sess.colonyDetail=c.id; render(); toast(`${c.name} に参加しました`);
      return;
    }
    sess.modal=null; render();
  };
  if(delBtn) delBtn.onclick = async ()=>{
    if(m.kind==='event'){
      if(m.occurrenceDate && m.data.repeat && m.scope!=='all'){
        // この回だけ消す：繰り返しは残したまま、その日を除外日に足す。
        m.data.exdates = (m.data.exdates||[]).concat(m.occurrenceDate);
      }else{
        DB.events = DB.events.filter(x=>x.id!==m.data.id);
      }
      await save('events');
    }
    if(m.kind==='task'){
      DB.tasks = DB.tasks.filter(x=>x.id!==m.data.id);
      await save('tasks');
    }
    if(m.kind==='ttcell'){
      const [d,p]=m.key.split('_');
      DB.timetable = DB.timetable.filter(x=>!(x.dayOfWeek==d && x.period==p));
      await save('timetable');
    }
    sess.modal=null; render();
  };
}

/* ============ INIT ============ */
(async function init(){
  await loadAll();
  render();
})();
</script>
