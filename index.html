<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>他力本願カレンダー</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');

:root{
  --paper:      #F7F7F4;
  --paper-2:    #EFEEE8;
  --bg-outer:   #ECEAE3;
  --ink:        #1C1B19;
  --ink-soft:   #6E6A61;
  --line:       #E6E3DA;
  --hanko:      #E0402B;
  --hanko-soft: #E0402B16;
  --highlight:  #F5B93B;
  --pen-blue:   #2F6FED;
  --sage:       #17966A;
  --white:      #FFFFFF;
  --danger:     #E1392B;
  --radius:     18px;
  --shadow: 0 1px 2px rgba(20,18,15,.04), 0 8px 20px -8px rgba(20,18,15,.12);
  --sidebar-w: 236px;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-outer);
  min-height:100vh; min-height:100dvh;
  font-family:'Inter','Zen Kaku Gothic New', sans-serif;
  color:var(--ink);
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

/* ---------- app shell ---------- */
.frame{
  width:100%;
  max-width:100%;
  background:var(--paper);
  min-height:100dvh;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* ---------- header ---------- */
.topbar{
  padding:18px 20px 12px;
  border-bottom:1px solid var(--line);
  background:var(--paper);
  position:relative;
  z-index:2;
}
.brand{
  font-family:'Inter','Zen Kaku Gothic New',sans-serif;
  font-weight:800;
  font-size:18px;
  letter-spacing:-.01em;
  display:flex;
  align-items:baseline;
  gap:8px;
}
.brand small{
  font-family:'Zen Kaku Gothic New',sans-serif;
  font-weight:500;
  font-size:11px;
  color:var(--ink-soft);
  letter-spacing:.02em;
}
.screen-title{
  margin-top:10px;
  font-family:'Inter','Zen Kaku Gothic New',sans-serif;
  font-size:19px;
  font-weight:700;
  letter-spacing:-.01em;
  color:var(--ink);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.screen-title .idx{
  display:none;
}

/* ---------- main scroll area ---------- */
.main{
  flex:1;
  overflow-y:auto;
  padding:16px 16px 90px;
}
.main::-webkit-scrollbar{width:0;}

/* ---------- bottom tabs (mobile) ---------- */
.tabbar{
  display:flex;
  border-top:1px solid var(--line);
  background:rgba(247,247,244,.92);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  position:absolute;
  left:0; right:0; bottom:0;
  z-index:3;
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  flex:1;
  padding:9px 2px calc(9px + env(safe-area-inset-bottom, 0px));
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  cursor:pointer;
  color:var(--ink-soft);
  font-size:10px;
  font-weight:600;
  border:none;
  background:none;
  font-family:'Inter','Zen Kaku Gothic New',sans-serif;
  position:relative;
  border-radius:12px;
  transition:color .15s;
}
.tab svg{width:21px;height:21px;stroke:var(--ink-soft);transition:stroke .15s;}
.tab.active{color:var(--hanko);}
.tab.active svg{stroke:var(--hanko);}

/* ---------- generic elements ---------- */
.card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px 16px;
  margin-bottom:10px;
  position:relative;
  box-shadow:var(--shadow);
}
.card::after{
  content:"";
  position:absolute; left:0; top:14px; bottom:14px; width:3px; border-radius:3px;
  background:var(--pen-blue);
  opacity:.7;
}
.card.done::after{background:var(--sage);}
.card.ai::after{background:var(--highlight);}

.label-row{display:flex; align-items:center; gap:6px; margin-bottom:5px; flex-wrap:wrap;}
.chip{
  font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:999px;
  border:1px solid transparent;
}
.chip.ai{color:#8a6d0f; background:#FBF0C7;}
.chip.blue{color:var(--pen-blue); background:#EAF1FF;}
.chip.proj{color:var(--sage); background:#E6F5EE;}

.title-row{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.item-title{font-weight:700; font-size:15px; line-height:1.4; letter-spacing:-.005em;}
.item-title.strike{text-decoration:line-through; color:var(--ink-soft);}
.item-sub{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}

.section-label{
  font-family:'Inter','Zen Kaku Gothic New',sans-serif;
  font-size:12px; font-weight:700; color:var(--ink-soft); margin:20px 0 8px; letter-spacing:.02em;
  display:flex; align-items:center; gap:8px; text-transform:uppercase;
}
.section-label::after{content:""; flex:1; border-bottom:1px solid var(--line);}

.fab{
  position:absolute; right:18px; bottom:calc(18px + env(safe-area-inset-bottom, 0px));
  width:54px; height:54px; border-radius:50%;
  background:var(--hanko); color:var(--white);
  display:flex; align-items:center; justify-content:center;
  border:none; box-shadow:0 10px 22px -6px rgba(224,64,43,.55);
  font-size:26px; cursor:pointer; z-index:4;
  transition:transform .12s;
}
.fab:active{transform:scale(.92);}

.btn{
  font-family:'Inter','Zen Kaku Gothic New',sans-serif;
  font-weight:700; font-size:14px;
  padding:12px 16px; border-radius:12px; border:1.5px solid var(--ink);
  background:var(--ink); color:var(--white);
  cursor:pointer; width:100%;
  transition:transform .1s, opacity .1s;
}
.btn.ghost{background:transparent; color:var(--ink);}
.btn.hanko{background:var(--hanko); border-color:var(--hanko);}
.btn:active{transform:scale(.985); opacity:.9;}
.btn:disabled{opacity:.4; cursor:default;}

input[type=text], input[type=date], input[type=time], input[type=password], textarea, select{
  width:100%; font-family:inherit; font-size:15px;
  border:1.5px solid var(--line); background:var(--white);
  border-radius:12px; padding:11px 12px; margin-bottom:10px; color:var(--ink);
  transition:border-color .15s;
}
input:focus, textarea:focus, select:focus{ border-color:var(--pen-blue); outline:none; }
label.f{font-size:11.5px; color:var(--ink-soft); display:block; margin-bottom:5px; font-weight:700;}
.field{margin-bottom:12px;}
.row2{display:flex; gap:8px;}
.row2 > *{flex:1;}

.check{
  width:22px;height:22px; border:1.5px solid var(--line); border-radius:50%;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer;
  background:var(--white); transition:background .15s, border-color .15s;
}
.check.on{background:var(--sage); border-color:var(--sage); color:white; font-size:12px;}

/* modal */
.overlay{
  position:absolute; inset:0; background:rgba(20,18,15,.45);
  display:flex; align-items:flex-end; z-index:20;
}
.sheet{
  width:100%; background:var(--paper);
  border-radius:20px 20px 0 0; padding:20px 20px 24px; max-height:86%; overflow-y:auto;
  animation:up .22s cubic-bezier(.2,.8,.3,1);
  box-shadow:0 -8px 30px -8px rgba(20,18,15,.2);
}
@keyframes up{from{transform:translateY(24px); opacity:0} to{transform:translateY(0); opacity:1}}
.sheet h3{font-family:'Inter','Zen Kaku Gothic New',sans-serif; margin:0 0 14px; font-size:17px; font-weight:800;}

/* calendar grid */
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:6px;}
.cal-dow{text-align:center; font-size:10.5px; color:var(--ink-soft); font-weight:700; padding-bottom:6px;}
.cal-day{
  aspect-ratio:1; background:var(--white); border:1px solid var(--line); border-radius:10px;
  font-size:12px; padding:4px; position:relative; color:var(--ink-soft); cursor:pointer;
  transition:background .12s, border-color .12s;
}
.cal-day.pad{background:transparent; border-color:transparent;}
.cal-day.today{background:var(--ink); border-color:var(--ink); color:var(--white); font-weight:700;}
.cal-day .dot{position:absolute; bottom:4px; left:4px; right:4px; height:4px; border-radius:2px; background:var(--pen-blue); opacity:.85;}
.cal-day.today .dot{background:var(--white);}
.cal-day.sel{background:var(--hanko-soft); border-color:var(--hanko); color:var(--ink); font-weight:700;}
.cal-day.sel.today{background:var(--hanko); border-color:var(--hanko); color:var(--white);}

/* timetable */
.tt-wrap{overflow-x:auto;}
.tt-grid{display:grid; grid-template-columns:34px repeat(6,1fr); gap:4px; min-width:520px;}
.tt-h{text-align:center; font-size:11px; font-weight:700; color:var(--ink-soft); padding:6px 0;}
.tt-period{font-size:10px; color:var(--ink-soft); display:flex; align-items:center; justify-content:center;}
.tt-cell{
  background:var(--white); border:1px solid var(--line); border-radius:10px; min-height:54px;
  padding:6px; font-size:11px; cursor:pointer; display:flex; flex-direction:column; justify-content:center;
  transition:border-color .12s;
}
.tt-cell.empty{color:var(--line); justify-content:center; align-items:center;}
.tt-cell b{font-size:12px; display:block;}
.tt-cell span{color:var(--ink-soft); font-size:10px;}

/* stamp animation */
.stamp-wrap{position:relative; display:flex; align-items:center; justify-content:center; height:180px;}
.stamp{
  width:120px; height:120px; border-radius:50%; border:4px solid var(--hanko); color:var(--hanko);
  display:flex; align-items:center; justify-content:center; font-family:'Zen Kaku Gothic New',sans-serif;
  font-size:26px; font-weight:900; transform:rotate(-10deg) scale(2.6); opacity:0;
  animation:stampdown .5s cubic-bezier(.2,1.4,.4,1) forwards; animation-delay:.15s;
}
@keyframes stampdown{ to{ transform:rotate(-10deg) scale(1); opacity:1; } }

/* upload dropzone */
.dropzone{
  border:1.5px dashed var(--line); border-radius:16px; padding:36px 14px; text-align:center;
  color:var(--ink-soft); font-size:13px; cursor:pointer; background:var(--white); margin-bottom:14px;
  transition:border-color .15s, background .15s;
}
.dropzone:hover{border-color:var(--pen-blue); background:#F7FAFF;}
.dropzone svg{stroke:var(--ink-soft); width:30px; height:30px; margin-bottom:8px;}
.preview-img{width:100%; border-radius:14px; border:1px solid var(--line); margin-bottom:14px; max-height:220px; object-fit:cover;}

/* progress steps */
.steps{display:flex; flex-direction:column; gap:10px; margin:20px 0;}
.step{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--line);}
.step .dot{width:9px;height:9px;border-radius:50%; border:1.5px solid var(--line); flex-shrink:0;}
.step.active{color:var(--ink);}
.step.active .dot{background:var(--pen-blue); border-color:var(--pen-blue);}
.step.done{color:var(--sage);}
.step.done .dot{background:var(--sage); border-color:var(--sage);}

.empty-state{text-align:center; padding:56px 20px; color:var(--ink-soft);}
.empty-state svg{width:38px;height:38px;stroke:var(--line); margin-bottom:10px;}
.empty-state p{font-size:13.5px; margin:0;}

.toast{
  position:absolute; left:50%; bottom:calc(84px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%);
  background:var(--ink); color:var(--white); font-size:12.5px; font-weight:700;
  padding:10px 18px; border-radius:999px; z-index:40; opacity:0; pointer-events:none;
  box-shadow:0 8px 20px -6px rgba(20,18,15,.4);
  transition:opacity .25s, transform .25s;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

.badge-count{
  position:absolute; top:-4px; right:-6px; background:var(--hanko); color:white;
  font-size:9px; border-radius:8px; padding:1px 5px; font-weight:700;
}
/* 解析が裏で進んでいる間、タブを離れても「まだ動いている」と分かるように。 */
.tab-busy{
  position:absolute; top:2px; left:calc(50% + 7px); width:8px; height:8px;
  border-radius:50%; background:var(--pen-blue); box-shadow:0 0 0 2px var(--paper);
  animation:tabpulse 1.1s ease-in-out infinite;
}
@keyframes tabpulse{ 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(.7);} }
@media (min-width:760px){
  .tab-busy{ top:9px; left:auto; right:10px; }
}
.candidate{border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:8px; background:var(--white);}
.candidate .top{display:flex; gap:8px; align-items:flex-start;}
.candidate input[type=text]{margin-bottom:6px;}
.link-btn{background:none;border:none;color:var(--pen-blue); font-size:13px; font-weight:700; padding:6px 0; cursor:pointer; font-family:inherit;}

/* project progress */
.progress-track{height:6px; background:var(--paper-2); border-radius:4px; overflow:hidden; margin-top:8px;}
.progress-fill{height:100%; background:var(--pen-blue); border-radius:4px; transition:width .3s;}

/* header right side */
.title-right{display:flex; align-items:center; gap:10px;}
.icon-btn{
  background:none; border:none; padding:7px; margin:-7px; cursor:pointer; display:flex;
  border-radius:10px; color:var(--ink-soft); transition:background .12s, color .12s;
}
.icon-btn svg{width:20px; height:20px; stroke:currentColor; fill:none;}
.icon-btn.on{color:var(--hanko); background:var(--hanko-soft);}

/* month / week / day switch */
.viewswitch{display:flex; gap:2px; background:var(--paper-2); border-radius:12px; padding:3px; margin-bottom:14px;}
.viewswitch-btn{
  flex:1; padding:7px 0; border:none; background:transparent; cursor:pointer; border-radius:9px;
  font-family:'Inter','Zen Kaku Gothic New',sans-serif; font-size:12.5px; font-weight:700; color:var(--ink-soft);
  transition:background .15s, color .15s;
}
.viewswitch-btn.on{background:var(--white); color:var(--ink); box-shadow:var(--shadow);}

/* due-soon panel */
.due-panel{border:1px solid var(--line); border-radius:16px; padding:12px 14px; margin-bottom:14px; background:var(--white); box-shadow:var(--shadow);}
.due-head{font-size:11px; font-weight:700; color:var(--hanko); margin-bottom:6px; letter-spacing:.02em; text-transform:uppercase;}
.due-row{display:flex; gap:8px; align-items:baseline; padding:6px 0; cursor:pointer; border-top:1px solid var(--line);}
.due-row:first-of-type{border-top:none;}
.due-when{font-size:10.5px; font-weight:700; color:var(--pen-blue); flex-shrink:0; min-width:52px;}
.due-row.late .due-when{color:var(--danger);}
.due-title{font-size:13.5px; font-weight:500; line-height:1.4;}

/* overdue tasks */
.card.overdue::after{background:var(--danger);}
.chip.late{color:var(--danger); background:#FCE7E5;}
.late-text{color:var(--danger); font-weight:700;}

/* lessons pulled in from the timetable */
.card.lesson{background:var(--paper-2); box-shadow:none;}
.card.lesson::after{background:var(--sage); opacity:.5;}
.chip.lesson{color:var(--sage); background:#E6F5EE;}

/* week view */
.week-day{margin-bottom:16px;}
.week-head{
  font-size:12.5px; font-weight:700; color:var(--ink-soft); padding:4px 0 8px;
  border-bottom:1px solid var(--line); margin-bottom:8px; cursor:pointer;
}
.week-day.today .week-head{color:var(--hanko);}
.week-none{font-size:12.5px; color:var(--line); padding:2px 0 6px;}

/* day view */
.hour-grid{display:grid; grid-template-columns:34px 1fr; gap:0 8px;}
.hour-label{
  font-size:10px; color:var(--ink-soft); text-align:right; padding-top:6px;
  font-variant-numeric:tabular-nums; border-top:1px solid var(--line);
}
.hour-slot{min-height:36px; padding-top:6px; border-top:1px solid var(--line);}

/* search filters */
.filter-row{display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap;}
.filter-chip{
  font-family:'Inter','Zen Kaku Gothic New',sans-serif; font-size:12px; font-weight:700;
  padding:7px 14px; border-radius:999px; border:1.5px solid var(--line);
  background:var(--white); color:var(--ink-soft); cursor:pointer; transition:all .12s;
}
.filter-chip.on{background:var(--ink); border-color:var(--ink); color:var(--white);}

/* checkbox row */
.toggle{display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:700; cursor:pointer;}
.toggle input{width:18px; height:18px; accent-color:var(--hanko); margin:0;}

/* saved handouts */
.print-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.print-thumb{
  padding:0; border:1px solid var(--line); border-radius:12px; background:var(--white);
  aspect-ratio:1; overflow:hidden; cursor:pointer;
}
.print-thumb img{width:100%; height:100%; object-fit:cover; display:block;}

/* keyboard focus */
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible,
.cal-day:focus-visible, .card:focus-visible{
  outline:2px solid var(--pen-blue); outline-offset:2px;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
}

/* =========================================================================
   TABLET & DESKTOP — the app opens as a windowed shell with a side rail
   instead of a bottom tab bar. Nothing about the markup changes; only how
   the same elements are arranged.
   ========================================================================= */
@media (min-width:760px){
  body{ padding:28px; align-items:center; }
  .frame{
    max-width:1180px;
    height:calc(100dvh - 56px);
    min-height:0;
    border-radius:24px;
    border:1px solid var(--line);
    box-shadow:0 30px 60px -30px rgba(20,18,15,.35);
    display:grid;
    grid-template-columns:var(--sidebar-w) 1fr;
    grid-template-rows:auto 1fr;
  }
  .frame.auth-mode{ grid-template-columns:1fr; }

  .topbar{ grid-column:2; grid-row:1; padding:24px 32px 16px; }
  .main{ grid-column:2; grid-row:2; padding:8px 32px 40px; max-width:920px; margin:0 auto; width:100%; }
  .frame.auth-mode .main{ grid-column:1; max-width:none; padding:0; }

  /* side rail */
  .tabbar{
    position:static;
    grid-column:1; grid-row:1 / -1;
    flex-direction:column;
    align-items:stretch;
    gap:2px;
    padding:22px 12px;
    border-top:none;
    border-right:1px solid var(--line);
    background:var(--paper-2);
    backdrop-filter:none; -webkit-backdrop-filter:none;
  }
  .tabbar::before{
    content:"他力本願";
    font-family:'Inter','Zen Kaku Gothic New',sans-serif;
    font-weight:800; font-size:15px; letter-spacing:-.01em;
    padding:6px 12px 20px;
  }
  .tab{
    flex:none;
    flex-direction:row;
    justify-content:flex-start;
    gap:11px;
    padding:10px 12px;
    font-size:13.5px;
    text-align:left;
  }
  .tab svg{width:19px;height:19px;flex-shrink:0;}
  .tab:hover{background:var(--white); color:var(--ink);}
  .tab.active{background:var(--white); color:var(--hanko); box-shadow:var(--shadow);}

  .fab{ position:absolute; right:32px; bottom:32px; }
  .toast{ bottom:32px; }

  /* modal becomes a centered dialog instead of a bottom sheet */
  .overlay{ align-items:center; justify-content:center; padding:24px; }
  .sheet{
    width:100%; max-width:520px; max-height:min(720px, 86%);
    border-radius:20px; animation:pop .18s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes pop{from{transform:scale(.97); opacity:0} to{transform:scale(1); opacity:1}}

  /* auth screens become a centered card instead of edge-to-edge */
  .auth-shell{ display:flex; align-items:center; justify-content:center; height:100%; padding:40px; }
  .auth-card{
    width:100%; max-width:380px;
    min-height:0 !important; height:auto !important; display:block !important;
    background:var(--white); border:1px solid var(--line); border-radius:20px;
    padding:36px !important; box-shadow:0 20px 45px -20px rgba(20,18,15,.25);
  }
  .auth-card > div{ flex:none !important; }
}

@media (min-width:1180px){
  .frame{ max-width:1320px; }
}
</style>
</head>
<body>

<div class="frame" id="frame">
  <div class="topbar">
    <div class="brand">他力本願カレンダー <small id="userTag"></small></div>
    <div class="screen-title">
      <span id="screenTitle">カレンダー</span>
      <span class="title-right">
        <button class="icon-btn" id="searchBtn" aria-label="検索"></button>
        <span class="idx" id="screenIdx">1</span>
      </span>
    </div>
  </div>
  <div class="main" id="main"></div>
  <div class="tabbar" id="tabbar"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ============ ICONS ============ */
const ICONS = {

/* ============ DATES ============ */
// toISOString() は UTC 基準なので、日本時間だと朝 9 時前に前日の日付が返る。
// 「今日」がずれると期限の判定まで巻き添えになるので、端末のローカル日付で扱う。
function ymd(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function todayStr(){ return ymd(new Date()); }
function parseDate(s){ return new Date(s+'T00:00:00'); }
function addDays(s,n){ const d=parseDate(s); d.setDate(d.getDate()+n); return ymd(d); }
const DOW_JP = ['日','月','火','水','木','金','土'];
function fmtDate(s){ const d=parseDate(s); return `${d.getMonth()+1}/${d.getDate()}(${DOW_JP[d.getDay()]})`; }

/* ============ 予定の組み立て ============ */
// カレンダーに出る予定は3種類ある。手で入れた単発の予定、繰り返しのその日の分、
// そして時間割から導いた授業。授業と繰り返しは実データとして増やさず、
// 表示するときに毎回組み立てる（同じ予定が二重に増えるのを避けるため）。

// 各限の開始時刻。学校ごとに違うので、変えるならここだけ直せばよい。
const PERIOD_START = {1:'08:50', 2:'09:50', 3:'10:50', 4:'11:50', 5:'13:30', 6:'14:30'};

// 繰り返し予定がその日に発生するか。初回の日も対象に含む。
function repeatsOn(ev, dateStr){
  const r = ev.repeat;
  if(!r) return false;
  const start = ev.startAt.slice(0,10);
  if(dateStr < start) return false;
  if(r.until && dateStr > r.until) return false;
  if((ev.exdates||[]).includes(dateStr)) return false;   // この回だけ消された
  const a = parseDate(start), b = parseDate(dateStr);
  if(r.freq==='daily')   return true;
  if(r.freq==='weekly')  return a.getDay()  === b.getDay();
  if(r.freq==='monthly') return a.getDate() === b.getDate();
  return false;
}
// 繰り返しの1回分。元の予定と区別できるよう occurrenceDate を持たせる。
function occurrenceOf(ev, dateStr){
  return {...ev, occurrenceDate:dateStr, startAt: dateStr + ev.startAt.slice(10)};
}
// 時間割は dayOfWeek が 1=月〜6=土 で、Date#getDay() とそのまま一致する。
// 日曜は該当するコマが無いので自然に空になる。
function timetableEventsFor(dateStr){
  const dow = parseDate(dateStr).getDay();
  return DB.timetable.filter(e=>e.dayOfWeek===dow).map(e=>({
    id: 'tt_'+e.id+'_'+dateStr,
    title: e.subject,
    description: [e.room, e.teacher].filter(Boolean).join('・'),
    startAt: dateStr+'T'+(PERIOD_START[e.period] || '08:50'),
    allDay: false,
    source: 'timetable',
    period: e.period,
    readOnly: true,
  }));
}
// その日に出るものを全部集めて、終日を先頭に、あとは時刻順で返す。
function eventsForDate(dateStr){
  const out = [];
  DB.events.forEach(ev=>{
    if(ev.repeat){
      if(repeatsOn(ev, dateStr)) out.push(occurrenceOf(ev, dateStr));
    }else if(ev.startAt.slice(0,10)===dateStr){
      out.push(ev);
    }
  });
  out.push(...timetableEventsFor(dateStr));
  return out.sort((a,b)=>
    (b.allDay?1:0)-(a.allDay?1:0) || a.startAt.localeCompare(b.startAt));
}

/* ============ API ============ */
// バックエンド（github.com/gcs-coding-team/tarikihonganncalendar）に繋ぐ層。
//
// 既定では同じオリジンの /v1 を叩く。API を別オリジンに置くときは、このページを
// 読む前に window.TARIKI_API_ORIGIN を設定し、サーバー側の FRONTEND_ORIGIN に
// このページのオリジンを入れる（対で設定しないとブラウザが弾く）。
// サーバーに届かないときは ONLINE=false のまま端末内だけで動く。
const API_ORIGIN = (window.TARIKI_API_ORIGIN || '').replace(/\/$/, '');
const API_BASE = API_ORIGIN + '/v1';
let ONLINE = false;
let AUTH = { userId:null, token:null };

const SERVER_KEYS = ['events','timetable','colonies','tasks','projects'];

async function api(method, path, body){
  const res = await fetch(API_BASE+path, {
    method,
    headers: {
      ...(body ? {'Content-Type':'application/json'} : {}),
      ...(AUTH.token  ? {'Authorization':'Bearer '+AUTH.token} : {}),
      ...(AUTH.userId ? {'X-User-ID': AUTH.userId} : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if(res.status===204) return null;
  const json = await res.json().catch(()=>null);
  if(!res.ok){
    const err = new Error(json?.error?.code || String(res.status));
    err.code = json?.error?.code; err.status = res.status;
    throw err;
  }
  return json?.data;
}

// サーバーの返すコードを、その場で読める言葉にする。
function loginError(e, mode){
  if(e.status===401) return 'メールアドレスかパスワードが違います';
  if(e.status===409) return 'そのメールアドレスは登録済みです。ログインしてください';
  if(e.status===400) return mode==='register'
    ? 'メールアドレスの形式か、パスワードの長さを確かめてください'
    : '入力を確かめてください';
  return 'サーバーに繋がりませんでした';
}

// 画像はそのままの形で送る。JSON に包んで base64 にすると容量が 1.3 倍になる。
async function apiBinary(method, path, body){
  const res = await fetch(API_BASE+path, {
    method,
    headers: {
      'Content-Type': 'application/octet-stream',
      ...(AUTH.token  ? {'Authorization':'Bearer '+AUTH.token} : {}),
      ...(AUTH.userId ? {'X-User-ID': AUTH.userId} : {}),
    },
    body,
  });
  const json = await res.json().catch(()=>null);
  if(!res.ok){
    const err = new Error(json?.error?.code || String(res.status));
    err.code = json?.error?.code; err.status = res.status;
    throw err;
  }
  return json?.data;
}

// 画像の口はトークンを要る。<img src> はヘッダーを送れないので、こちらで
// 取ってきて object URL に差し替える。一度取ったものは使い回す。
const printImages = new Map();
async function fillPrintImages(){
  for(const img of document.querySelectorAll('img[data-src]')){
    const id = img.dataset.src;
    if(printImages.has(id)){ img.src = printImages.get(id); continue; }
    try{
      const res = await fetch(`${API_BASE}/prints/${id}/image`, {
        headers: AUTH.token ? {'Authorization':'Bearer '+AUTH.token} : {},
      });
      if(!res.ok) continue;
      const url = URL.createObjectURL(await res.blob());
      printImages.set(id, url);
      img.src = url;
    }catch(e){ /* 出せないだけなので、画面は壊さない */ }
  }
}

// フロントは 'YYYY-MM-DDTHH:mm'（端末のローカル時刻）、サーバーは RFC3339。
function toServerTime(local){ return new Date(local).toISOString(); }
function toLocalTime(rfc){
  const d = new Date(rfc);
  return ymd(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

function toServerEvent(e){
  return {
    title: e.title, description: e.description||'',
    startAt: toServerTime(e.startAt),
    endAt:   toServerTime(e.startAt),
    allDay: !!e.allDay,
    repeat: e.repeat || null,
    exdates: e.exdates || [],
  };
}
function fromServerEvent(row, prev){
  return {
    id: row.id, title: row.title, description: row.description||'',
    startAt: toLocalTime(row.startAt), allDay: !!row.allDay,
    version: row.version,
    repeat: row.repeat || null, exdates: row.exdates || [],
    sourcePrintId: prev?.sourcePrintId ?? null,
  };
}
function fromServerTask(row){
  return {
    id: row.id, title: row.title, description: row.description||'',
    dueAt: row.dueAt || '', status: row.status,
    projectId: row.projectId || null, version: row.version,
    ai: false,
  };
}
function toServerTask(t){
  return {
    title: t.title, description: t.description||'',
    dueAt: t.dueAt || '', status: t.status || 'OPEN',
    projectId: t.projectId || '',
  };
}

const Server = {
  async register(email, password, displayName){
    const out = await api('POST','/auth/register', {email, password, displayName});
    AUTH = { userId: out.user.id, token: out.token };
    return out;
  },
  async signIn(email, password){
    const out = await api('POST','/auth/login', {email, password});
    AUTH = { userId: out.user.id, token: out.token };
    return out;
  },
  // 開き直したときに、保存しておいたトークンがまだ生きているか確かめる。
  async resume(token){
    AUTH = { userId:null, token };
    const me = await api('GET','/auth/me');
    AUTH = { userId: me.id, token };
    return me;
  },
  async logout(){
    if(AUTH.token) await api('POST','/auth/logout').catch(()=>{});
    AUTH = { userId:null, token:null };
  },
  async pull(){
    const [events, timetable, rows, tasks, projects] = await Promise.all([
      api('GET','/events'), api('GET','/timetable-entries'), api('GET','/colonies'),
      api('GET','/tasks'), api('GET','/projects'),
    ]);
    const byId = Object.fromEntries(DB.events.map(e=>[e.id,e]));
    DB.events    = (events||[]).map(r=>fromServerEvent(r, byId[r.id]));
    DB.timetable = (timetable||[]).map(r=>({
      id:r.id, dayOfWeek:r.dayOfWeek, period:r.period,
      subject:r.subject, room:r.room||'', teacher:r.teacher||'', version:r.version,
    }));
    DB.tasks    = (tasks||[]).map(fromServerTask);
    DB.projects = (projects||[]).map(r=>({
      id:r.id, name:r.name, description:r.description||'',
      version:r.version, createdAt:(r.createdAt||'').slice(0,10),
    }));
    DB.colonies = await Promise.all((rows||[]).map(async c=>({
      id:c.id, name:c.name, description:c.description||'',
      inviteCode:c.inviteCode||'', ownerId:c.ownerUserId,
      members: (await api('GET',`/colonies/${c.id}/members`).catch(()=>[]) || [])
                 .map(m=>({id:m.userId, name:m.displayName || m.userId, role:m.role})),
      feed: (await api('GET',`/colonies/${c.id}/feed`).catch(()=>[]) || [])
                 .map(f=>({sourceType:f.sourceType==='TASK'?'task':'event', sourceId:f.sourceId,
                           titleSnapshot:f.titleSnapshot||'(タイトルなし)', by:f.createdBy, date:''})),
    })));
  },
  getColony: (id)=>api('GET','/colonies/'+id),
  createEvent:  (e)=>api('POST','/events', toServerEvent(e)),
  updateEvent:  (e)=>api('PATCH','/events/'+e.id, {...toServerEvent(e), version:e.version}),
  deleteEvent:  (id)=>api('DELETE','/events/'+id),
  createTask:   (t)=>api('POST','/tasks', toServerTask(t)),
  updateTask:   (t)=>api('PATCH','/tasks/'+t.id, {...toServerTask(t), projectId:t.projectId||null, version:t.version}),
  deleteTask:   (id)=>api('DELETE','/tasks/'+id),
  createProject:(p)=>api('POST','/projects', {name:p.name, description:p.description||''}),
  updateProject:(p)=>api('PATCH','/projects/'+p.id, {name:p.name, description:p.description||'', version:p.version}),
  deleteProject:(id)=>api('DELETE','/projects/'+id),
  createEntry:  (t)=>api('POST','/timetable-entries', {dayOfWeek:t.dayOfWeek, period:t.period, subject:t.subject, room:t.room||'', teacher:t.teacher||''}),
  updateEntry:  (t)=>api('PATCH','/timetable-entries/'+t.id, {subject:t.subject, room:t.room||'', teacher:t.teacher||'', version:t.version}),
  deleteEntry:  (id)=>api('DELETE','/timetable-entries/'+id),
  createColony: (c)=>api('POST','/colonies', {name:c.name, description:c.description||''}),
  joinByCode:   (inviteCode)=>api('POST','/colonies/join', {inviteCode}),
  leaveColony:  (id)=>api('POST',`/colonies/${id}/leave`, {}),
  shareItem:    (colonyId, t)=>api('POST',`/colonies/${colonyId}/shared-items`, {sourceType:'TASK', sourceId:t.id, titleSnapshot:t.title}),
};

// サーバーが落ちていても操作を止めない。失敗したら端末内の変更だけ残す。
async function withServer(fn, whenOffline){
  if(!ONLINE) return whenOffline?.();
  try{ return await fn(); }
  catch(e){
    console.error('server call failed', e);
    toast(e.code==='CONFLICT' ? '他の端末で更新されています。開き直してください'
                              : 'サーバーに反映できませんでした');
    return whenOffline?.();
  }
}

/* ============ LOCAL STORAGE ============ */
// window.storage は Claude のアーティファクト内でしか存在しない。
// 普通のWebページとして配信するときは localStorage に落とす。これが無いと
// リロードのたびにログイン状態も、サーバーに置き場の無いタスクとプロジェクトも消える。
const STORE = window.storage || {
  get: async (k)=>{ const v = localStorage.getItem('tariki_'+k); return v===null ? null : {value:v}; },
  set: async (k,v)=>{ localStorage.setItem('tariki_'+k, v); },
};

async function loadAll(){
  const keys = ['events','tasks','timetable','colonies','projects','user','token'];
  for(const k of keys){
    try{
      const r = await STORE.get(k, false);
      if(r && r.value) DB[k] = JSON.parse(r.value);
    }catch(e){ /* not found yet, keep default */ }
  }
  if(!DB.events) DB.events=[]; if(!DB.tasks) DB.tasks=[]; if(!DB.timetable) DB.timetable=[]; if(!DB.colonies) DB.colonies=[]; if(!DB.projects) DB.projects=[];
}
async function save(key){
  try{ await STORE.set(key, JSON.stringify(DB[key]), false); }catch(e){ console.error('save failed',key,e); }
}

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1800);
}

  titleEl.textContent = TITLES[sess.tab];
  idxEl.textContent = IDXMAP[sess.tab];

  // 解析はどのタブを見ていても裏で進む。プリント以外を見ていても気付けるように、
  // 処理中だけタブに小さな印を出す。
  const printBusy = sess.printFlow && sess.printFlow.step==='processing';
  tabbar.innerHTML = TABS.map(t=>`
    <button class="tab ${sess.tab===t.k?'active':''}" data-tab="${t.k}">
      ${t.icon}<span>${t.label}</span>${t.k==='print' && printBusy && sess.tab!=='print' ? '<span class="tab-busy"></span>' : ''}
    </button>`).join('');
  tabbar.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ sess.tab=b.dataset.tab; sess.modal=null; render(); });

  const searchBtn = document.getElementById('searchBtn');
  searchBtn.innerHTML = ICONS.search;
  searchBtn.classList.toggle('on', sess.tab==='search');
  searchBtn.onclick = ()=>{
    sess.tab = sess.tab==='search' ? 'cal' : 'search';
    sess.modal = null;
    render();
    const q = document.getElementById('searchInput');
    if(q) q.focus();
  };

  let html = '';
  if(sess.tab==='cal') html = renderCalendar();
  else if(sess.tab==='tt') html = renderTimetable();
  else if(sess.tab==='task') html = renderTasks();
  else if(sess.tab==='proj') html = renderProjects();
  else if(sess.tab==='print'){ html = renderPrint(); loadPrints(); }
  else if(sess.tab==='colony') html = renderColony();
  else if(sess.tab==='settings') html = renderSettings();
  else if(sess.tab==='search') html = renderSearch();

  main.innerHTML = html;
  bindScreen();
  renderModal();
  fillPrintImages();
}

function bindLogin(){
  const forgot = document.getElementById('li-forgot');
  if(forgot) forgot.onclick = ()=>{ sess.loginMode='forgot'; render(); };
  const back = document.getElementById('li-back');
  if(back) back.onclick = ()=>{ sess.loginMode='login'; render(); };

  const send = document.getElementById('li-send');
  if(send) send.onclick = async ()=>{
    const email = document.getElementById('li-email').value.trim();
    const note = document.getElementById('li-error');
    if(!email){ note.style.color='var(--danger)'; note.textContent='メールアドレスを入れてください'; return; }
    try{ await api('POST','/auth/password-reset', {email}); }
    catch(e){ note.style.color='var(--danger)'; note.textContent='サーバーに繋がりませんでした'; return; }
    // 登録が無くても同じ文面。ここで違いを出すと、アカウントの有無が漏れる。
    note.style.color='var(--ink-soft)';
    note.textContent='そのアドレスに登録があれば、コードを送りました。';
    sess.loginMode='confirm';
    setTimeout(()=>{ render(); toast('コードを入れてください'); }, 900);
  };

  const reset = document.getElementById('li-reset');
  if(reset) reset.onclick = async ()=>{
    const token = document.getElementById('li-token').value.trim();
    const pass  = document.getElementById('li-pass').value;
    const fail  = (m)=>{ document.getElementById('li-error').textContent = m; };
    if(!token){ fail('コードを入れてください'); return; }
    if(pass.length < 8){ fail('パスワードは8文字以上にしてください'); return; }
    try{
      await api('POST','/auth/password-reset/confirm', {token, password:pass});
    }catch(e){
      fail(e.code==='INVALID_TOKEN'
        ? 'コードが違うか、期限が切れています'
        : 'パスワードの形式を確かめてください');
      return;
    }
    sess.loginMode='login'; render(); toast('新しいパスワードで入れます');
  };

  document.querySelectorAll('[data-mode]').forEach(el=>{
    el.onclick = ()=>{ sess.loginMode = el.dataset.mode; render(); };
  });

  const loginBtn = document.getElementById('li-btn');
  if(!loginBtn) return;   // 再設定の画面にはこのボタンが無い
  loginBtn.onclick = async ()=>{
    if(ONLINE){
      const mode  = sess.loginMode || 'login';
      const email = document.getElementById('li-email').value.trim();
      const pass  = document.getElementById('li-pass').value;
      const name  = document.getElementById('li-name')?.value.trim() || '';
      const fail  = (msg)=>{ document.getElementById('li-error').textContent = msg; };

      if(!email || !pass){ fail('メールアドレスとパスワードを入れてください'); return; }
      if(mode==='register' && pass.length < 8){ fail('パスワードは8文字以上にしてください'); return; }

      let out;
      try{
        out = mode==='register'
          ? await Server.register(email, pass, name)
          : await Server.signIn(email, pass);
      }catch(e){
        fail(loginError(e, mode));
        return;
      }
      DB.user = {id: out.user.id, name: out.user.displayName};
      DB.token = out.token;
      await withServer(()=>Server.pull());
      await Promise.all(['user','token', ...SERVER_KEYS].map(save));
      sess.tab='cal'; render(); toast(`${DB.user.name} さんでログインしました`);
      return;
    }

    // サーバーがいないときは、この端末の中だけのおためし。
    const name = document.getElementById('li-name').value.trim() || 'ゲスト';
    DB.user = {name, id: uid()};
    await save('user');
    seedIfEmpty();
    await Promise.all(['events','tasks','timetable','projects'].map(save));
    sess.tab = 'cal';
    render();
  };
}

/* ============ CALENDAR ============ */
const CAL_VIEWS = [{k:'month',label:'月'},{k:'week',label:'週'},{k:'day',label:'日'}];

function renderCalendar(){
  const view = sess.calView;
  const body = view==='week' ? renderWeekView()
             : view==='day'  ? renderDayView()
             : renderMonthView();
  return `
    <div class="viewswitch">
      ${CAL_VIEWS.map(v=>`<button class="viewswitch-btn ${view===v.k?'on':''}" data-view="${v.k}">${v.label}</button>`).join('')}
    </div>
    ${renderDueSummary()}
    ${body}
    <button class="fab" id="addEventFab">${ICONS.plus}</button>
  `;
}

// 期限が今日・明日のタスクと、過ぎてしまったタスクを画面の先頭に出す。
// アプリを開いた人が最初に見る場所なので、ここに無いものは気付かれない。
function renderDueSummary(){
  const today = todayStr(), tomorrow = addDays(today,1);
  const open = DB.tasks.filter(t=>t.status==='OPEN' && t.dueAt);
  const overdue = open.filter(t=>t.dueAt <  today).sort((a,b)=>a.dueAt.localeCompare(b.dueAt));
  const soon    = open.filter(t=>t.dueAt === today || t.dueAt === tomorrow)
                      .sort((a,b)=>a.dueAt.localeCompare(b.dueAt));
  if(!overdue.length && !soon.length) return '';
  const line = (t)=>{
    const late = t.dueAt < today;
    const when = t.dueAt===today ? '今日' : t.dueAt===tomorrow ? '明日'
               : `${-diffDays(today,t.dueAt)}日超過`;
    return `<div class="due-row ${late?'late':''}" data-task="${t.id}">
      <span class="due-when">${when}</span>
      <span class="due-title">${esc(t.title)}</span>
    </div>`;
  };
  return `
    <div class="due-panel">
      <div class="due-head">${overdue.length? `期限切れ ${overdue.length} 件・`:''}まもなく ${soon.length} 件</div>
      ${overdue.map(line).join('')}
      ${soon.map(line).join('')}
    </div>`;
}
function diffDays(a,b){ return Math.round((parseDate(b)-parseDate(a))/86400000); }

function renderMonthView(){
  const m = sess.calMonth;
  const y=m.getFullYear(), mo=m.getMonth();
  const startPad = new Date(y,mo,1).getDay();
  const daysInMonth = new Date(y,mo+1,0).getDate();
  const cells=[];
  for(let i=0;i<startPad;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);

  let grid = `<div class="cal-grid">` + DOW_JP.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  cells.forEach(d=>{
    if(d===null){ grid+=`<div class="cal-day pad"></div>`; return; }
    const dateStr = `${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has = eventsForDate(dateStr).length>0;
    grid += `<div class="cal-day ${dateStr===todayStr()?'today':''} ${dateStr===sess.selectedDate?'sel':''}" data-date="${dateStr}">${d}${has?'<div class="dot"></div>':''}</div>`;
  });
  grid += `</div>`;

  const dayEvents = eventsForDate(sess.selectedDate);
  return `
    ${navRow(`${y}年 ${mo+1}月`)}
    ${grid}
    <div class="section-label">${fmtDate(sess.selectedDate)} の予定</div>
    ${dayEvents.length? dayEvents.map(evCard).join('') : emptyState('この日は予定がありません')}
  `;
}

// 週表示。1日ずつ見出しを立てて、その日の予定をぶら下げる。
function renderWeekView(){
  const base = parseDate(sess.selectedDate);
  const start = addDays(sess.selectedDate, -base.getDay());   // その週の日曜
  const days = Array.from({length:7}, (_,i)=>addDays(start,i));
  const label = `${fmtDate(start)} 〜 ${fmtDate(days[6])}`;
  return `
    ${navRow(label)}
    ${days.map(d=>{
      const evs = eventsForDate(d);
      return `<div class="week-day ${d===todayStr()?'today':''}">
        <div class="week-head" data-date="${d}">${fmtDate(d)}</div>
        ${evs.length? evs.map(evCard).join('')
                    : `<div class="week-none">予定なし</div>`}
      </div>`;
    }).join('')}
  `;
}

// 日表示。時間軸に沿って並べるので、空き時間の形が見える。
function renderDayView(){
  const d = sess.selectedDate;
  const evs = eventsForDate(d);
  const timed  = evs.filter(e=>!e.allDay);
  const allDay = evs.filter(e=>e.allDay);
  const from = timed.length ? Math.min(8, +timed[0].startAt.slice(11,13)) : 8;
  const to   = timed.length ? Math.max(19, +timed[timed.length-1].startAt.slice(11,13)+1) : 19;
  const hours = [];
  for(let h=from; h<=to; h++) hours.push(h);
  return `
    ${navRow(fmtDate(d))}
    ${allDay.length? `<div class="section-label">終日</div>${allDay.map(evCard).join('')}` : ''}
    <div class="hour-grid">
      ${hours.map(h=>{
        const inHour = timed.filter(e=>+e.startAt.slice(11,13)===h);
        return `<div class="hour-label">${String(h).padStart(2,'0')}</div>
          <div class="hour-slot">${inHour.map(evCard).join('')}</div>`;
      }).join('')}
    </div>
  `;
}

function navRow(label){
  return `<div class="label-row" style="justify-content:space-between; margin-bottom:10px;">
    <button class="link-btn" data-nav="-1">${ICONS.arrow}</button>
    <div style="font-weight:800; font-size:16px; letter-spacing:-.01em;">${label}</div>
    <button class="link-btn" data-nav="1" style="transform:scaleX(-1);">${ICONS.arrow}</button>
  </div>`;
}
function evCard(e){
  const time = e.allDay? '終日' : e.startAt.slice(11,16);
  const lesson = e.source==='timetable';
  // 授業は時間割から導いたものなので、ここからは編集させない（時間割タブで直す）。
  const attr = lesson ? '' : ` data-ev="${e.id}"${e.occurrenceDate?` data-occ="${e.occurrenceDate}"`:''}`;
  return `<div class="card ${lesson?'lesson':''} ${e.sourcePrintId?'ai':''}"${attr}>
    <div class="label-row">
      ${lesson? `<span class="chip lesson">${e.period}限</span>`:''}
      ${e.sourcePrintId?'<span class="chip ai">AI取込</span>':''}
      ${e.repeat?'<span class="chip blue">繰り返し</span>':''}
      <span class="chip blue">${time}</span>
    </div>
    <div class="title-row"><div class="item-title">${esc(e.title)}</div></div>
    ${e.description? `<div class="item-sub">${esc(e.description)}</div>`:''}
  </div>`;
}
function emptyState(msg){
  return `<div class="empty-state">${ICONS.cal}<p>${msg}</p></div>`;
}
function esc(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* ============ TIMETABLE ============ */
const DOWS = ['月','火','水','木','金','土'];
function renderTimetable(){
  const periods = [1,2,3,4,5,6];
  const byCell = {};
  DB.timetable.forEach(e=>{ byCell[e.dayOfWeek+'_'+e.period]=e; });
  let rows = '';
  periods.forEach(p=>{
    rows += `<div class="tt-period">${p}</div>`;
    for(let d=1; d<=6; d++){
      const e = byCell[d+'_'+p];
      rows += e
        ? `<div class="tt-cell" data-edit="${d}_${p}"><b>${esc(e.subject)}</b><span>${esc(e.room)}</span></div>`
        : `<div class="tt-cell empty" data-edit="${d}_${p}">+</div>`;
    }
  });
  return `
    <div class="tt-wrap">
      <div class="tt-grid">
        <div></div>${DOWS.map(d=>`<div class="tt-h">${d}</div>`).join('')}
        ${rows}
      </div>
    </div>
    <div class="section-label">使い方</div>
    <div class="item-sub" style="line-height:1.7;">空いているマスをタップしてコマを登録。登録済みのマスをタップすると編集・削除ができます。</div>
  `;
}

/* ============ TASKS ============ */
function renderTasks(){
  const open = DB.tasks.filter(t=>t.status==='OPEN').sort((a,b)=>(a.dueAt||'').localeCompare(b.dueAt||''));
  const done = DB.tasks.filter(t=>t.status==='DONE');
  return `
    <div class="section-label">未完了（${open.length}）</div>
    ${open.length? open.map(taskCard).join('') : emptyState('未完了のタスクはありません')}
    ${done.length? `<div class="section-label">完了済み（${done.length}）</div>` + done.map(taskCard).join('') : ''}
    <button class="fab" id="addTaskFab">${ICONS.plus}</button>
  `;
}
function taskCard(t){
  const isDone = t.status==='DONE';
  const proj = t.projectId? DB.projects.find(p=>p.id===t.projectId) : null;
  const overdue = !isDone && t.dueAt && t.dueAt < todayStr();
  return `<div class="card ${isDone?'done':''} ${overdue?'overdue':''} ${t.ai?'ai':''}" data-task="${t.id}">
    <div class="title-row">
      <div style="display:flex; gap:10px; align-items:flex-start; flex:1;">
        <div class="check ${isDone?'on':''}" data-toggle="${t.id}">${isDone? '済':''}</div>
        <div style="flex:1;">
          <div class="label-row">${t.ai?'<span class="chip ai">AI取込</span>':''}${proj?`<span class="chip proj">${esc(proj.name)}</span>`:''}${overdue?'<span class="chip late">期限切れ</span>':''}</div>
          <div class="item-title ${isDone?'strike':''}">${esc(t.title)}</div>
          ${t.description? `<div class="item-sub">${esc(t.description)}</div>`:''}
          ${t.dueAt? `<div class="item-sub ${overdue?'late-text':''}">期限：${fmtDate(t.dueAt)}</div>`:''}
        </div>
      </div>
      <button class="link-btn" data-deltask="${t.id}">${ICONS.trash}</button>
    </div>
  </div>`;
}

/* ============ SEARCH ============ */
const SEARCH_FILTERS = [{k:'all',label:'すべて'},{k:'open',label:'未完了'},{k:'done',label:'完了'}];

function renderSearch(){
  const raw = sess.query || '';
  const q = raw.trim().toLowerCase();
  const filter = sess.searchFilter || 'all';
  const head = `
    <input type="text" id="searchInput" placeholder="タスク・予定を検索" value="${esc(raw)}" autocomplete="off">
    <div class="filter-row">
      ${SEARCH_FILTERS.map(f=>`<button class="filter-chip ${filter===f.k?'on':''}" data-filter="${f.k}">${f.label}</button>`).join('')}
    </div>`;
  if(!q) return head + emptyState('探したい言葉を入れてください');

  const hit = (s)=> (s||'').toLowerCase().includes(q);

  let tasks = DB.tasks.filter(t=>hit(t.title) || hit(t.description));
  if(filter==='open') tasks = tasks.filter(t=>t.status==='OPEN');
  if(filter==='done') tasks = tasks.filter(t=>t.status==='DONE');
  tasks.sort((a,b)=>(a.dueAt||'').localeCompare(b.dueAt||''));

  // 予定には完了・未完了が無いので、状態で絞っているときは対象から外す。
  const events = filter==='all'
    ? DB.events.filter(e=>hit(e.title) || hit(e.description))
               .sort((a,b)=>a.startAt.localeCompare(b.startAt))
    : [];

  if(!tasks.length && !events.length){
    return head + emptyState(`「${esc(raw.trim())}」に一致するものはありません`);
  }
  return head
    + (tasks.length ? `<div class="section-label">タスク（${tasks.length}）</div>` + tasks.map(taskCard).join('') : '')
    + (events.length? `<div class="section-label">予定（${events.length}）</div>` + events.map(evCard).join('') : '');
}

// プリントを実際にサーバーへ送って読み取ってもらう。
// スマホの写真は3000〜4000px・数MBあることが多いが、AIが実際に見るのは
// もっと粗い解像度で十分。大きいまま送ると、サーバー側での画像の読み込みと
// エンコードだけで数秒〜十数秒よけいにかかる。長辺1600pxまで縮めてJPEGに
// 詰め直してから送ることで、文字の読み取りやすさはほぼ変えずに時間を削る。
async function shrinkImage(file, maxDim=1600, quality=0.85){
  if(!('createImageBitmap' in window)) return null;
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
  // 既に小さい画像を無理に再エンコードすると、むしろ画質が落ちるだけ。
  if(scale === 1 && file.size <= 1.5*1024*1024){ bitmap.close?.(); return null; }
  const w = Math.max(1, Math.round(bitmap.width*scale));
  const h = Math.max(1, Math.round(bitmap.height*scale));
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
  bitmap.close?.();
  const blob = await new Promise(res=>canvas.toBlob(res, 'image/jpeg', quality));
  if(!blob) return null;
  return { blob, bytes: await blob.arrayBuffer(), contentType:'image/jpeg' };
}

// ジョブを立ててから画像を送る二段構えなのは、途中で落ちたときに
// 何が起きたのかを後から辿れるようにするため。
async function runAnalysis(){
  const flow = sess.printFlow;
  sess.printFlow = {...flow, step:'processing', sub:0};
  render();

  try{
    const job = await api('POST','/uploads/jobs',
      {contentType: flow.contentType || 'image/png', filename: flow.filename || 'print'});
    sess.printFlow = {...sess.printFlow, jobId: job.id, sub:1};
    render();
    // 画像を送っている間が読み取り中。
    sess.printFlow = {...sess.printFlow, sub:2};
    const out = await apiBinary('POST', `/uploads/jobs/${job.id}/analyse`, flow.bytes);
    if(out.job.status === 'failed'){
      sess.printFlow = {...sess.printFlow, step:'failed', reason: out.job.resultSummary};
      render();
      if(sess.tab!=='print') toast('プリントの読み取りに失敗しました');
      return;
    }
    sess.prints = null;   // 新しく1枚増えたので取り直す
    sess.printFlow = {
      ...sess.printFlow, step:'review',
      candidates: (out.candidates||[]).map(c=>({...c, include:true})),
    };
    render();
    // 待っている間に別のタブを見ていたかもしれないので、終わったことを教える。
    if(sess.tab!=='print') toast('プリントの読み取りが終わりました');
  }catch(e){
    sess.printFlow = {
      ...sess.printFlow, step:'failed',
      reason: e.status===413 ? '画像が大きすぎます（10MBまで）'
                             : 'サーバーに繋がりませんでした',
    };
    render();
    if(sess.tab!=='print') toast('プリントの読み取りに失敗しました');
  }
}

    const list = open.length? open : DB.tasks;
    if(!list.length){
      return `<h3>共有するタスクを選ぶ</h3>${emptyState('共有できるタスクがありません')}`;
    }
    return `
      <h3>共有するタスクを選ぶ</h3>
      ${!open.length? '<div class="item-sub" style="margin-bottom:10px;">未完了のタスクが無いので、完了済みを含めて出しています。</div>':''}
      ${list.map(t=>`
        <div class="card" data-pick="${t.id}">
          <div class="item-title">${esc(t.title)}</div>
          ${t.dueAt? `<div class="item-sub">期限：${fmtDate(t.dueAt)}</div>`:''}
        </div>`).join('')}
    `;
  }
  return '';
}

/* ============ BIND SCREEN EVENTS ============ */
function bindScreen(){
  // calendar
  document.querySelectorAll('.cal-day[data-date]').forEach(el=>{
    el.onclick = ()=>{ sess.selectedDate = el.dataset.date; render(); };
  });
  // 月表示は月送り、週表示は週送り、日表示は日送り。
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=>{
      const step = parseInt(el.dataset.nav);
      if(sess.calView==='month'){
        sess.calMonth.setMonth(sess.calMonth.getMonth()+step);
      }else{
        sess.selectedDate = addDays(sess.selectedDate, step*(sess.calView==='week'?7:1));
        sess.calMonth = parseDate(sess.selectedDate);
      }
      render();
    };
  });
  document.querySelectorAll('[data-view]').forEach(el=>{
    el.onclick = ()=>{ sess.calView = el.dataset.view; render(); };
  });
  document.querySelectorAll('.week-head[data-date]').forEach(el=>{
    el.onclick = ()=>{ sess.selectedDate = el.dataset.date; sess.calView='day'; render(); };
  });
  const addEventFab = document.getElementById('addEventFab');
  if(addEventFab) addEventFab.onclick = ()=>{ sess.modal={kind:'event', data:null}; renderModal(); };
  document.querySelectorAll('[data-ev]').forEach(el=>{
    el.onclick = ()=>{
      const e = DB.events.find(x=>x.id===el.dataset.ev);
      if(!e) return;
      sess.modal = {kind:'event', data:e, occurrenceDate: el.dataset.occ || null, scope:'one'};
      renderModal();
    };
  });

  // timetable
  document.querySelectorAll('[data-edit]').forEach(el=>{
    el.onclick = ()=>{ sess.modal={kind:'ttcell', key:el.dataset.edit}; renderModal(); };
  });

  // tasks
  const addTaskFab = document.getElementById('addTaskFab');
  if(addTaskFab) addTaskFab.onclick = ()=>{ sess.modal={kind:'task', data:null}; renderModal(); };
  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.onclick = async (ev)=>{
      ev.stopPropagation();          // カードを開かずにチェックだけ切り替える
      const t = DB.tasks.find(x=>x.id===el.dataset.toggle);
      t.status = t.status==='DONE'?'OPEN':'DONE';
      const row = await withServer(()=>Server.updateTask(t));
      if(row) t.version = row.version;
      await save('tasks'); render(); toast(t.status==='DONE'?'完了にしました':'未完了に戻しました');
    };
  });
  document.querySelectorAll('[data-deltask]').forEach(el=>{
    el.onclick = async (ev)=>{
      ev.stopPropagation();
      DB.tasks = DB.tasks.filter(x=>x.id!==el.dataset.deltask);
      await withServer(()=>Server.deleteTask(el.dataset.deltask));
      await save('tasks'); render();
    };
  });
  // タスクをタップして編集する。チェックと削除は上で stopPropagation してある。
  document.querySelectorAll('[data-task]').forEach(el=>{
    el.onclick = ()=>{
      const t = DB.tasks.find(x=>x.id===el.dataset.task);
      if(!t) return;
      sess.modal = {kind:'task', data:t};
      renderModal();
    };
  });

  // search
  const searchInput = document.getElementById('searchInput');
  if(searchInput){
    const apply = ()=>{
      sess.query = searchInput.value;
      const pos = searchInput.selectionStart;
      render();
      const next = document.getElementById('searchInput');
      if(next){ next.focus(); next.setSelectionRange(pos,pos); }
    };
    // 日本語入力の変換中に再描画すると入力が壊れるので、確定するまで待つ。
    searchInput.oninput = (ev)=>{ if(!ev.isComposing) apply(); };
    searchInput.addEventListener('compositionend', apply);
  }
  document.querySelectorAll('[data-filter]').forEach(el=>{
    el.onclick = ()=>{ sess.searchFilter = el.dataset.filter; render(); };
  });

  // projects
  const addProjectFab = document.getElementById('addProjectFab');
  if(addProjectFab) addProjectFab.onclick = ()=>{ sess.modal={kind:'project', data:null}; renderModal(); };
  document.querySelectorAll('[data-project]').forEach(el=>{
    el.onclick = ()=>{ sess.projectDetail = el.dataset.project; render(); };
  });
  const backProject = document.getElementById('backProject');
  if(backProject) backProject.onclick = ()=>{ sess.projectDetail=null; render(); };
  const editProject = document.getElementById('editProject');
  if(editProject) editProject.onclick = ()=>{
    const p = DB.projects.find(x=>x.id===sess.projectDetail);
    sess.modal={kind:'project', data:p}; renderModal();
  };
  const addTaskToProject = document.getElementById('addTaskToProject');
  if(addTaskToProject) addTaskToProject.onclick = ()=>{ sess.modal={kind:'task', data:null, projectId:sess.projectDetail}; renderModal(); };
  const delProject = document.getElementById('delProject');
  if(delProject) delProject.onclick = async ()=>{
    const pid = sess.projectDetail;
    DB.projects = DB.projects.filter(x=>x.id!==pid);
    // サーバー側も所属タスクを無所属にするだけで消さない。
    DB.tasks.forEach(t=>{ if(t.projectId===pid) t.projectId=null; });
    await withServer(async ()=>{ await Server.deleteProject(pid); await Server.pull(); });
    await Promise.all(['projects','tasks'].map(save));
    sess.projectDetail=null; render(); toast('プロジェクトを削除しました');
  };

  // print flow
  document.querySelectorAll('[data-print]').forEach(el=>{
    el.onclick = ()=>{
      const p = (sess.prints||[]).find(x=>x.id===el.dataset.print);
      if(p){ sess.modal = {kind:'print', data:p}; renderModal(); }
    };
  });

  const dz = document.getElementById('dropzone');
  const fi = document.getElementById('fileInput');
  if(dz) dz.onclick = ()=> fi.click();
  if(fi) fi.onchange = async ()=>{
    const file = fi.files[0]; if(!file) return;
    const shrunk = await shrinkImage(file).catch(()=>null);
    sess.printFlow = {
      step:'preview',
      imgSrc: URL.createObjectURL(shrunk? shrunk.blob : file),
      bytes: shrunk? shrunk.bytes : await file.arrayBuffer(),
      contentType: shrunk? shrunk.contentType : (file.type || 'image/png'),
      filename: file.name || 'print',
    };
    render();
  };
  const cancelFlow = document.getElementById('cancelFlow');
  if(cancelFlow) cancelFlow.onclick = ()=>{ sess.printFlow=null; render(); };
  const startAnalysis = document.getElementById('startAnalysis');
  if(startAnalysis) startAnalysis.onclick = runAnalysis;
  const retryBtn = document.getElementById('retryBtn');
  if(retryBtn) retryBtn.onclick = runAnalysis;
  document.querySelectorAll('[data-cand-toggle]').forEach(el=>{
    el.onclick = ()=>{ const i=+el.dataset.candToggle; sess.printFlow.candidates[i].include = !sess.printFlow.candidates[i].include; render(); };
  });
  document.querySelectorAll('[data-cand-title]').forEach(el=>{
    el.oninput = ()=>{ sess.printFlow.candidates[+el.dataset.candTitle].title = el.value; };
  });
  document.querySelectorAll('[data-cand-date]').forEach(el=>{
    el.oninput = ()=>{ sess.printFlow.candidates[+el.dataset.candDate].date = el.value; };
  });
  document.querySelectorAll('[data-cand-time]').forEach(el=>{
    el.oninput = ()=>{ sess.printFlow.candidates[+el.dataset.candTime].time = el.value; };
  });
  const commitBtn = document.getElementById('commitBtn');
  if(commitBtn) commitBtn.onclick = async ()=>{
    const chosen = sess.printFlow.candidates.filter(c=>c.include);
    const printId = uid();
    for(const c of chosen){
      if(c.type==='task'){
        const draft = {id:uid(), title:c.title, description:'', dueAt:c.date, status:'OPEN', ai:true, sourcePrintId:printId, projectId:null};
        const row = await withServer(()=>Server.createTask(draft));
        DB.tasks.push(row ? {...fromServerTask(row), ai:true, sourcePrintId:printId} : draft);
      }else{
        const draft = {id:uid(), title:c.title, description:'', startAt:c.date+'T'+(c.time||'09:00'), allDay:false, repeat:null, exdates:[], sourcePrintId:printId};
        const row = await withServer(()=>Server.createEvent(draft));
        DB.events.push(row ? {...fromServerEvent(row), sourcePrintId:printId} : draft);
      }
    }
    await Promise.all(['tasks','events'].map(save));
    sess.printFlow = {...sess.printFlow, step:'stamping'};
    render();
    setTimeout(()=>{ sess.printFlow = {...sess.printFlow, step:'done', committedCount:chosen.length}; render(); }, 900);
  };
  const backToCal = document.getElementById('backToCal');
  if(backToCal) backToCal.onclick = ()=>{ sess.printFlow=null; sess.tab='cal'; render(); };
  const finishFlow = document.getElementById('finishFlow');
  if(finishFlow) finishFlow.onclick = ()=>{ sess.printFlow=null; render(); };

  // colony
  const addColonyFab = document.getElementById('addColonyFab');
  if(addColonyFab) addColonyFab.onclick = ()=>{ sess.modal={kind:'colony'}; renderModal(); };
  document.querySelectorAll('[data-colony]').forEach(el=>{
    el.onclick = ()=>{ sess.colonyDetail = el.dataset.colony; render(); };
  });
  const backColony = document.getElementById('backColony');
  if(backColony) backColony.onclick = ()=>{ sess.colonyDetail=null; render(); };
  const joinColonyBtn = document.getElementById('joinColonyBtn');
  if(joinColonyBtn) joinColonyBtn.onclick = ()=>{ sess.modal={kind:'joinColony'}; renderModal(); };
  const shareTaskToColony = document.getElementById('shareTaskToColony');
  if(shareTaskToColony) shareTaskToColony.onclick = ()=>{ sess.modal={kind:'pickTask'}; renderModal(); };
  const leaveColony = document.getElementById('leaveColony');
  if(leaveColony) leaveColony.onclick = async ()=>{
    const c = DB.colonies.find(x=>x.id===sess.colonyDetail);
    await withServer(()=>Server.leaveColony(c.id));
    c.members = (c.members||[]).filter(m=>m.id!==DB.user.id);
    // 最後の1人が抜けたら、誰も入れないコロニーが残らないよう消す。
    if(!c.members.length) DB.colonies = DB.colonies.filter(x=>x.id!==c.id);
    await save('colonies');
    sess.colonyDetail=null; render(); toast('コロニーから抜けました');
  };

  // settings
  const syncBtn = document.getElementById('syncBtn');
  if(syncBtn) syncBtn.onclick = async ()=>{
    await withServer(async ()=>{
      await Server.pull();
      await Promise.all(SERVER_KEYS.map(save));
      toast('サーバーから引き直しました');
    });
    render();
  };
  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.onclick = async ()=>{
    await withServer(()=>Server.logout());
    // 端末に残っているものも消す。次に開いたときログインが戻ってしまう。
    DB.user = null; DB.token = null;
    DB.events=[]; DB.tasks=[]; DB.timetable=[]; DB.colonies=[]; DB.projects=[];
    await Promise.all(['user','token', ...SERVER_KEYS].map(save));
    sess.tab='login'; sess.loginMode='login'; render();
  };
}

function bindModal(){
  const m = sess.modal;
  const saveBtn = document.getElementById('m-save');
  const delBtn = document.getElementById('m-del');

  // 終日にしたら時刻欄は要らないので隠す
  const allDayBox = document.getElementById('m-allday');
  if(allDayBox) allDayBox.onchange = ()=>{
    document.getElementById('m-time-field').style.display = allDayBox.checked ? 'none' : '';
  };
  // 繰り返しを選んだときだけ「終わり」を出す
  const repeatSel = document.getElementById('m-repeat');
  if(repeatSel) repeatSel.onchange = ()=>{
    document.getElementById('m-until-field').style.display = repeatSel.value ? '' : 'none';
  };
  document.querySelectorAll('[data-scope]').forEach(el=>{
    el.onclick = ()=>{ sess.modal.scope = el.dataset.scope; renderModal(); };
  });
  // 共有するタスクを選ぶ
  document.querySelectorAll('[data-pick]').forEach(el=>{
    el.onclick = async ()=>{
      const c = DB.colonies.find(x=>x.id===sess.colonyDetail);
      const t = DB.tasks.find(x=>x.id===el.dataset.pick);
      if(!c || !t) return;
      c.feed = c.feed||[];
      if(c.feed.some(f=>f.sourceId===t.id)){ toast('このタスクは共有済みです'); return; }
      // サーバーは (colonyId, sourceType, sourceId) の重複を 409 で弾く。
      const row = await withServer(()=>Server.shareItem(c.id, t));
      if(row===undefined && ONLINE) return;   // 409 などで弾かれた
      c.feed.unshift({sourceType:'task', sourceId:t.id, titleSnapshot:t.title, by:DB.user.name, date:fmtDate(todayStr())});
      await save('colonies');
      sess.modal=null; render(); toast('共有しました');
    };
  });

  if(saveBtn) saveBtn.onclick = async ()=>{
    if(m.kind==='event'){
      const title = document.getElementById('m-title').value.trim();
      if(!title){ toast('タイトルを入力してください'); return; }
      const desc   = document.getElementById('m-desc').value;
      const date   = document.getElementById('m-date').value;
      const allDay = document.getElementById('m-allday').checked;
      const time   = allDay ? '00:00' : document.getElementById('m-time').value;
      const freq   = document.getElementById('m-repeat').value;
      const until  = document.getElementById('m-until').value || null;
      const repeat = freq ? {freq, until} : null;
      const fields = {title, description:desc, startAt:date+'T'+time, allDay};

      if(!m.data){
        const draft = {id:uid(), ...fields, repeat, exdates:[], sourcePrintId:null};
        const row = await withServer(()=>Server.createEvent(draft));
        DB.events.push(row ? {...fromServerEvent(row), repeat, exdates:[]} : draft);
      }else if(m.occurrenceDate && m.data.repeat && m.scope!=='all'){
        // この回だけ直す：元の繰り返しからその日を外し、単発の予定として切り出す。
        m.data.exdates = (m.data.exdates||[]).concat(m.occurrenceDate);
        const draft = {id:uid(), ...fields, repeat:null, exdates:[], sourcePrintId:m.data.sourcePrintId||null};
        const row = await withServer(()=>Server.createEvent(draft));
        DB.events.push(row ? fromServerEvent(row) : draft);
        await withServer(()=>Server.updateEvent(m.data));
      }else{
        Object.assign(m.data, fields, {repeat});
        const row = await withServer(()=>Server.updateEvent(m.data));
        if(row) m.data.version = row.version;
      }
      await save('events');
    }
    if(m.kind==='task'){
      const title = document.getElementById('m-title').value.trim();
      if(!title){ toast('タイトルを入力してください'); return; }
      const fields = {
        title,
        description: document.getElementById('m-desc').value,
        dueAt:       document.getElementById('m-date').value,
        projectId:   document.getElementById('m-project').value || null,
      };
      if(m.data){
        Object.assign(m.data, fields);
        const row = await withServer(()=>Server.updateTask(m.data));
        if(row) m.data.version = row.version;
      }else{
        const draft = {id:uid(), ...fields, status:'OPEN', ai:false};
        const row = await withServer(()=>Server.createTask(draft));
        DB.tasks.push(row ? fromServerTask(row) : draft);
      }
      await save('tasks');
    }
    if(m.kind==='project'){
      const name = document.getElementById('m-pname').value.trim();
      if(!name){ toast('名前を入力してください'); return; }
      const description = document.getElementById('m-pdesc').value;
      if(m.data){
        Object.assign(m.data, {name, description});
        const row = await withServer(()=>Server.updateProject(m.data));
        if(row) m.data.version = row.version;
      }else{
        const draft = {id:uid(), name, description, createdAt:todayStr()};
        const row = await withServer(()=>Server.createProject(draft));
        DB.projects.push(row ? {...draft, id:row.id, version:row.version} : draft);
      }
      await save('projects');
    }
    if(m.kind==='ttcell'){
      const [d,p] = m.key.split('_');
      const subject = document.getElementById('m-subject').value.trim();
      if(!subject){ toast('教科を入力してください'); return; }
      const room = document.getElementById('m-room').value;
      const teacher = document.getElementById('m-teacher').value;
      let ex = DB.timetable.find(x=>x.dayOfWeek==d && x.period==p);
      if(ex){
        Object.assign(ex, {subject, room, teacher});
        const row = await withServer(()=>Server.updateEntry(ex));
        if(row) ex.version = row.version;
      }else{
        const draft = {id:uid(), dayOfWeek:+d, period:+p, subject, room, teacher};
        const row = await withServer(()=>Server.createEntry(draft));
        DB.timetable.push(row ? {...draft, id:row.id, version:row.version} : draft);
      }
      await save('timetable');
    }
    if(m.kind==='colony'){
      const name = document.getElementById('m-name').value.trim();
      if(!name){ toast('名前を入力してください'); return; }
      const draft = {
        id:uid(), name,
        description: document.getElementById('m-desc').value,
        inviteCode: Math.random().toString(36).slice(2,8).toUpperCase(),
        ownerId: DB.user.id,
        members: [{id:DB.user.id, name:DB.user.name}],
        feed: [],
      };
      const row = await withServer(()=>Server.createColony(draft));
      DB.colonies.push(row ? {...draft, id:row.id, inviteCode:row.inviteCode, ownerId:row.ownerUserId} : draft);
      await save('colonies');
    }
    if(m.kind==='joinColony'){
      const code = document.getElementById('m-code').value.trim();
      if(!code){ toast('招待コードを入力してください'); return; }
      if(ONLINE){
        let joined;
        try{
          joined = await Server.joinByCode(code);
        }catch(e){
          toast(e.code==='CONFLICT' ? 'すでに参加しています'
                                    : 'そのコードのコロニーは見つかりません');
          return;
        }
        await withServer(()=>Server.pull());
        await save('colonies');
        sess.modal=null; sess.colonyDetail=joined.id; render(); toast(`${joined.name} に参加しました`);
        return;
      }
      const c = DB.colonies.find(x=>x.inviteCode.toUpperCase()===code.toUpperCase());
      if(!c){ toast('そのコードのコロニーは見つかりません'); return; }
      if(isMember(c)){ toast('すでに参加しています'); return; }
      c.members = (c.members||[]).concat({id:DB.user.id, name:DB.user.name});
      await save('colonies');
      sess.modal=null; sess.colonyDetail=c.id; render(); toast(`${c.name} に参加しました`);
      return;
    }
    sess.modal=null; render();
  };
  if(delBtn) delBtn.onclick = async ()=>{
    if(m.kind==='event'){
      if(m.occurrenceDate && m.data.repeat && m.scope!=='all'){
        // この回だけ消す：繰り返しは残したまま、その日を除外日に足す。
        m.data.exdates = (m.data.exdates||[]).concat(m.occurrenceDate);
        await withServer(()=>Server.updateEvent(m.data));
      }else{
        DB.events = DB.events.filter(x=>x.id!==m.data.id);
        await withServer(()=>Server.deleteEvent(m.data.id));
      }
      await save('events');
    }
    if(m.kind==='task'){
      DB.tasks = DB.tasks.filter(x=>x.id!==m.data.id);
      await withServer(()=>Server.deleteTask(m.data.id));
      await save('tasks');
    }
    if(m.kind==='ttcell'){
      const [d,p]=m.key.split('_');
      const gone = DB.timetable.find(x=>x.dayOfWeek==d && x.period==p);
      DB.timetable = DB.timetable.filter(x=>!(x.dayOfWeek==d && x.period==p));
      if(gone) await withServer(()=>Server.deleteEntry(gone.id));
      await save('timetable');
    }
    sess.modal=null; render();
  };
}

/* ============ INIT ============ */
(async function init(){
  await loadAll();
  await probeServer();
  // 前回のトークンがまだ生きていればそのまま入る。切れていればログイン画面へ。
  if(ONLINE && DB.token){
    try{
      const me = await Server.resume(DB.token);
      DB.user = {id: me.id, name: me.displayName};
      await Server.pull();
      await Promise.all(SERVER_KEYS.map(save));
    }catch(e){
      DB.token = null; DB.user = null;
      await Promise.all(['token','user'].map(save));
    }
  }
  render();
})();
</script>
